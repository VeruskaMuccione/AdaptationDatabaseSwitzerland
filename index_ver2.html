<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climate adaptation measures for Switzerland | NCCS-Impacts P5</title>
<meta name="description" content="Browse adaptation measures by climate risk and actor, with their effectiveness, costs and assessment criteria. Based on the NCCS-Impacts P5 table of measures.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6F6; --surface:#FFFFFF; --sunk:#E9EEEF; --ink:#13222C; --muted:#56666F; --line:#CFD8DB;
  --focus:#0B62D6; --on-ink:#FFFFFF;
  --good:#1B7A57; --mid:#A8690A; --poor:#B5362E;
  --hz-HI:#C9352B; --hz-HW:#2566B0; --hz-SH:#6A4AA5; --hz-SFG:#11849C; --hz-SO:#557F26; --hz-TR:#A56A12;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E161B; --surface:#162128; --sunk:#1D2A32; --ink:#E7EEF0; --muted:#9BABB3; --line:#2E3E47;
    --focus:#7DB4FF; --on-ink:#0E161B;
    --good:#56C79A; --mid:#E3AE4F; --poor:#F08A80;
    --hz-HI:#F0796E; --hz-HW:#74AEEE; --hz-SH:#B39BE6; --hz-SFG:#5CC6DA; --hz-SO:#9CC96A; --hz-TR:#E0AD55;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);font-stretch:78%;font-weight:700;line-height:1.1;margin:0;letter-spacing:.005em}
p{margin:0 0 .8em}
a{color:inherit;text-underline-offset:.18em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.15;padding:8px 0}
.brand b{font-family:var(--display);font-stretch:78%;font-size:1.15rem}
.brand span{font-size:.75rem;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:8px 12px;text-decoration:none;border-radius:4px;font-weight:500;border-bottom:3px solid transparent}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current=page]{border-bottom-color:var(--ink);border-radius:4px 4px 0 0}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:4px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;font-weight:500}
.btn:hover{filter:brightness(1.12)}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:.18em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.875rem}
.chip button{border:0;background:var(--sunk);border-radius:50%;width:20px;height:20px;line-height:1;padding:0}

/* start */
.hero{padding:56px 0 24px}
.hero h1{font-size:clamp(2.4rem,6vw,4.6rem);font-stretch:68%;font-weight:800;max-width:14ch;letter-spacing:-.005em}
.hero .lede{max-width:62ch;font-size:1.125rem;margin-top:20px}
.hero .lede p:last-child{margin-bottom:0}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px;margin:24px 0 20px}
.picker h2{font-size:1.5rem;margin-bottom:4px}
.picker .hint{color:var(--muted);margin-bottom:18px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:20px 16px}
.hz{border-top:5px solid var(--c);padding-top:10px}
.hz h3{font-size:1.05rem;color:var(--c);margin-bottom:8px}
.tile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;background:var(--paper);border:1.5px solid transparent;border-radius:4px;line-height:1.2}
.tile svg{color:var(--c);width:22px;height:22px}
.tile .n{margin-left:auto;color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums}
.tile:hover{border-color:var(--line)}
.tile[aria-pressed=true]{background:var(--c);color:#fff;border-color:var(--c);font-weight:600}
.tile[aria-pressed=true] svg,.tile[aria-pressed=true] .n{color:#fff}
@media (prefers-color-scheme:dark){.tile[aria-pressed=true],.tile[aria-pressed=true] svg,.tile[aria-pressed=true] .n{color:#0E161B}}
.actors{display:flex;flex-wrap:wrap;gap:8px}
.actors .tile{width:auto;margin:0;--c:var(--ink);padding-right:14px}
.actors .tile[aria-pressed=true]{color:var(--on-ink)}
.actors .tile[aria-pressed=true] svg,.actors .tile[aria-pressed=true] .n{color:var(--on-ink)}
.picker hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.go{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px}
.below{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:8px 0 56px}
.below a{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:var(--surface)}
.below a:hover{border-color:var(--ink)}
.below h3{font-size:1.15rem;margin-bottom:4px}

/* measures */
.page{padding:28px 0 64px}
.page>h1,.pagehead h1{font-size:clamp(1.8rem,3.5vw,2.6rem);font-stretch:70%;font-weight:800}
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.rail{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.rail>summary{display:none;padding:12px 16px;font-weight:600}
.rail .inner{padding:6px 16px 16px}
.facet{border-bottom:1px solid var(--line)}
.facet:last-of-type{border-bottom:0}
.facet>summary{padding:12px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.facet>summary::-webkit-details-marker{display:none}
.facet>summary::after{content:"+";color:var(--muted);font-weight:400}
.facet[open]>summary::after{content:"\2212"}
.facet .opts{padding:0 0 12px;max-height:420px;overflow:auto}
.opt{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.9375rem;line-height:1.3}
.opt input{margin:3px 0 0;accent-color:var(--ink);width:16px;height:16px;flex:none}
.opt .n{margin-left:auto;color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums;padding-left:6px}
.opt.zero{color:var(--muted)}
.optgroup{font-size:.8125rem;font-weight:700;color:var(--c);margin:8px 0 2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:10px 12px 10px 38px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
select{padding:10px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.status .count{font-weight:700;margin-right:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:4px;padding:14px 16px;width:100%}
.card:hover{border-color:var(--ink);border-left-color:var(--c)}
.badge{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:600;font-size:.875rem;line-height:1.2}
.card h3{font-family:var(--body);font-stretch:100%;font-size:1.02rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .who{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:.875rem;line-height:1.3}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.rate{font-size:.75rem;line-height:1.2;color:var(--muted)}
.rate b{display:block;color:var(--ink);font-weight:600;font-size:.8125rem;margin-top:3px}
.meter{width:26px;height:16px;display:block}
.meter .on{fill:currentColor}.meter .off{fill:var(--line)}
.meter .dash{fill:none;stroke:currentColor;stroke-width:1.8;stroke-dasharray:2 3;stroke-linecap:round}
.meter .na{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.t-good{color:var(--good)}.t-mid{color:var(--mid)}.t-poor{color:var(--poor)}.t-ink{color:var(--ink)}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:.75rem;padding:2px 8px;border-radius:3px;background:var(--sunk)}
.empty{padding:40px 24px;border:1.5px dashed var(--line);border-radius:6px;text-align:center}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .link{text-align:left;font-weight:600;text-decoration:none}
td .link:hover{text-decoration:underline}
.mcell{display:flex;gap:6px;align-items:center;white-space:nowrap}

/* detail */
dialog{border:0;padding:0;margin:0 0 0 auto;width:min(780px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;background:var(--surface);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(10,20,26,.55)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);border-top:6px solid var(--c);padding:12px 28px;display:flex;align-items:center;gap:12px;z-index:2}
.dhead .badge{margin-right:auto}
.dbody{padding:24px 28px 48px}
.dbody h2{font-size:clamp(1.5rem,3vw,2rem);font-stretch:74%;margin-bottom:6px}
.dbody .id{font-size:.8125rem;color:var(--muted);margin-bottom:16px;overflow-wrap:anywhere}
.dbody .desc{font-size:1.0625rem;max-width:66ch;white-space:pre-line}
.dbody section{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.dbody section>h3{font-size:1.25rem;margin-bottom:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin:0}
.facts dt{font-size:.8125rem;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.facts dd small{display:block;font-weight:400;color:var(--muted);font-size:.8125rem;line-height:1.35;margin-top:2px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit h4{font-family:var(--body);font-stretch:100%;font-size:1rem;font-weight:600;line-height:1.3}
.crit .lv{display:flex;gap:8px;align-items:center;font-weight:700;justify-self:end;white-space:nowrap}
.crit p{grid-column:1/-1;margin:2px 0 0;font-size:.9375rem;max-width:68ch;white-space:pre-line}
.crit p.what{color:var(--muted)}
.crit p.fig{background:var(--sunk);padding:8px 12px;border-radius:4px;margin-top:6px}
.plain{margin:0;padding-left:1.1em}
.plain li{margin-bottom:4px}
.pre{white-space:pre-line;overflow-wrap:anywhere}
.reflist{list-style:none;margin:0;padding:0}
.reflist li{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.reflist li:last-child{border-bottom:0}
.also{display:flex;flex-wrap:wrap;gap:8px}
.also button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--c);font-weight:600;font-size:.875rem}

/* indicators + references */
.prose{max-width:70ch}
.group{margin-top:36px}
.group>h2{font-size:1.6rem;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:8px}
.ind{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:8px 32px;padding:18px 0;border-bottom:1px solid var(--line)}
.ind h3{font-family:var(--body);font-stretch:100%;font-size:1.05rem;font-weight:700;line-height:1.3;margin-bottom:6px}
.ind .pre{font-size:.9375rem}
.scale{list-style:none;margin:0;padding:0}
.scale li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:.9375rem}
.scale li:last-child{border-bottom:0}
.scale li svg.ic{width:24px;height:24px}
.scale b{display:block}
.scale small{color:var(--muted);display:block;font-size:.8125rem}
.refs{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.ref{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:16px 20px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.ref:last-child{border-bottom:0}
.ref h3{font-family:var(--body);font-stretch:100%;font-size:1.02rem;font-weight:600;line-height:1.3}
.ref .k{font-size:.875rem;color:var(--muted)}
.ref:target{outline:3px solid var(--focus);outline-offset:-3px}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.875rem}

@media (max-width:900px){
  .wrap{padding:0 16px}
  .layout{grid-template-columns:1fr;gap:14px}
  .rail{position:static;max-height:none}
  .rail>summary{display:block}
  .picker{padding:20px 16px}
  .ind{grid-template-columns:1fr}
  .dhead{padding:10px 16px}.dbody{padding:20px 16px 40px}
  .rates{grid-template-columns:repeat(2,1fr)}
  .hero{padding-top:36px}
}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
</style>
</head>

c":"Measures that integrate technical installations","more":""},{"value":"Requirements","desc":"Requirements and permits for the implementation of specific measures (legal, etc.)","more":""}]},{"header":"Measure","def":"Title of the measure","more":"","options":[]},{"header":"Description of the measure","def":"Description of the measure, incl. possible activities, examples, etc.","more":"","options":[]},{"header":"Planned or autonomous adaptation","def":"Definition of whether the adaptation is planned or autonomous","more":"","options":[{"value":"autonomous adaptation","desc":"Adaptation undertaken independently by private actors without state intervention, often in response to climate-related impacts or damage that has occurred (NCCS, 2024).","more":""},{"value":"planned adaptation","desc":"Adaptation triggered by state intervention on the basis of political decisions (NCCS, 2024).","more":""}]},{"header":"Impact perimeter","def":"Description of the geographical perimeter in which the measure is implemented","more":"see worksheet \"Lists\"","options":[{"value":"whole of Switzerland","desc":"The measure is implemented throughout Switzerland","more":""},{"value":"Jura","desc":"The measure is implemented only in the Jura","more":"Based on FOEN (2017)"},{"value":"Swiss Plateau (Mittelland)","desc":"The measure is implemented only on the Swiss Plateau","more":"Based on FOEN (2017)"},{"value":"Pre-Alps","desc":"The measure is implemented only in the Pre-Alps","more":"Based on FOEN (2017)"},{"value":"Alps","desc":"The measure is implemented only in the Alps","more":"Based on FOEN (2017)"},{"value":"Southern Switzerland","desc":"The measure is implemented only in Southern Switzerland","more":"Based on FOEN (2017)"},{"value":"Agglomerations (urban areas)","desc":"The measure is implemented only in urban areas","more":"Based on FOEN (2017)"}]},{"header":"Impact reach","def":"Description of the reach over which the measure takes effect","more":"see worksheet \"Lists\"","options":[{"value":"national","desc":"The measure is implemented at national level","more":""},{"value":"regional","desc":"The measure is implemented at regional level","more":""},{"value":"local","desc":"The measure is implemented at local level","more":""}]},{"header":"Type of impact","def":"Description of how the measure takes effect","more":"see worksheet \"Lists\"","options":[{"value":"Increased adaptive capacity","desc":"The measure increases adaptive capacity","more":"Selection still to be reviewed"},{"value":"Reduced revenue losses","desc":"The measure reduces revenue losses in a specific sector","more":"Selection still to be reviewed"},{"value":"Reduced damage to health","desc":"The measure prevents damage to human health","more":"Selection still to be reviewed"},{"value":"Reduced physical damage","desc":"The measure prevents physical damage to buildings or infrastructure","more":"Selection still to be reviewed"}]},{"header":"Effectiveness","def":"Qualitative assessment of how effectively the measure works to permanently minimise the risk","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"direct, high impact","desc":"The measure has a direct and high impact; the risk can be reduced substantially (more than CHF 100 million per year if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -5)"},{"value":"direct, medium impact","desc":"The measure has a direct and medium impact; the risk can be reduced significantly (between CHF 20-100 million per year if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -3 and -4)"},{"value":"direct, low impact","desc":"The measure has a direct and low impact; the risk can be reduced in part (up to CHF 20 million per year if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -2)"},{"value":"indirect impact","desc":"The measure has an indirect impact (e.g. information and awareness raising, basic studies, monitoring, etc.)","more":""}]},{"header":"Quantifiability (impact)","def":"Qualitative assessment of whether the impact of the measure can be quantified","more":"see worksheet \"Lists\"","options":[{"value":"yes","desc":"The necessary basis (studies, data, etc.) is available to quantify the impact; the impact can be estimated with acceptable uncertainties","more":""},{"value":"no","desc":"The necessary basis (studies, data, etc.) is not available to quantify the impact; the impact cannot be estimated with sufficient certainty","more":""}]},{"header":"Quantifiability (costs)","def":"Qualitative assessment of whether the costs of the measure can be quantified","more":"see worksheet \"Lists\"","options":[{"value":"yes","desc":"The necessary basis (studies, data, etc.) is available to quantify the costs; the costs can be estimated with acceptable uncertainties","more":""},{"value":"no","desc":"The necessary basis (studies, data, etc.) is not available to quantify the costs; the costs cannot be estimated with sufficient certainty","more":""}]},{"header":"Remark on effectiveness and quantifiability","def":"Comment field for additional information on effectiveness and/or quantifiability","more":"","options":[]},{"header":"Investment costs (qualitative assessment)","def":"Qualitative assessment of the investment costs of the measure","more":"see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure costs more than CHF 100 million per year (if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -5)"},{"value":"medium","desc":"The measure costs between CHF 20 and 100 million per year (if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -3 and -4)"},{"value":"low","desc":"The measure costs up to CHF 20 million per year (if implemented Switzerland-wide)","more":"Based on FOEN (2024, not yet published) (cat. -2 and -1)"},{"value":"none","desc":"no investment costs","more":""},{"value":"na","desc":"cannot be estimated, as no cost modelling is carried out","more":""}]},{"header":"Investment costs (CAPEX, in CHF)","def":"(if available) Investment costs of the measure\n\nSpecifications according to the NCCS programme framework, as at 21.09.2023:\n- base year 2023 in real CHF\n- for \"historical\" costs, include inflation\n- report costs per year (--> annual investment costs)\n- discount rate 0% (costs today = costs in the future)","more":"","options":[]},{"header":"Annual operating costs (qualitative assessment)","def":"Qualitative assessment of the annual operating costs of the measure","more":"see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure costs more than CHF 20 million per year (if implemented Switzerland-wide)","more":"Expert assessment"},{"value":"medium","desc":"The measure costs between CHF 5 million and CHF 20 million per year (if implemented Switzerland-wide)","more":"Expert assessment"},{"value":"low","desc":"The measure costs up to CHF 5 million per year (if implemented Switzerland-wide)","more":"Expert assessment"},{"value":"none","desc":"no operating costs","more":""},{"value":"na","desc":"cannot be estimated, as no cost modelling is carried out","more":""}]},{"header":"Annual operating costs (OPEX, in CHF)","def":"(if available) Investment costs of the measure\n\nSpecifications according to the NCCS programme framework, as at 21.09.2023:\n- base year 2023 in real CHF\n- for \"historical\" costs, include inflation\n- report costs per year (--> annual investment costs)\n- discount rate 0% (costs today = costs in the future)","more":"","options":[]},{"header":"Avoided annual damage costs (qualitative assessment)","def":"Qualitative assessment of the reduced annual damage costs --> possibly a different term, since in the risk concept risk = damage x frequency","more":"see worksheet \"Lists\"","options":[{"value":"high","desc":"The adaptation measure can reduce damage costs significantly","more":""},{"value":"medium","desc":"The adaptation measure can reduce damage costs","more":""},{"value":"low","desc":"The adaptation measure can reduce damage costs only slightly","more":""},{"value":"indirect","desc":"The adaptation measure can reduce damage costs only indirectly","more":""}]},{"header":"Source and assumptions on the costs of adaptation","def":"Source and assumptions on the costs of adaptation","more":"","options":[]},{"header":"Macroeconomic impact","def":"Qualitative assessment of the macroeconomic effects of the measure","more":"see worksheet \"Lists\"","options":[{"value":"very positive impacts","desc":"If implemented across the board, the measure leads to significantly more value added within Switzerland","more":"Expert assessment"},{"value":"positive impacts","desc":"If implemented across the board, the measure leads to more value added within Switzerland","more":"Expert assessment"},{"value":"neutral impacts","desc":"If implemented across the board, the measure leads to more value added within Switzerland","more":"Expert assessment"},{"value":"negative impacts","desc":"If implemented across the board, the measure leads to less value added within Switzerland","more":"Expert assessment"},{"value":"very negative impacts","desc":"If implemented across the board, the measure leads to significantly less value added within Switzerland","more":"Expert assessment"}]},{"header":"Remark on macroeconomic impact","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Robustness","def":"Qualitative assessment of whether the measure has a positive effect under different climate scenarios","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure is equally effective under all emission scenarios (RCP 2.6 - RCP 8.5). The measure corresponds to a \"no-regret\" measure.","more":"UBA (2015), supplemented by EBP"},{"value":"medium","desc":"The measure is effective only under certain emission scenarios (e.g. only RCP 2.6 and RCP 4.5). The measure corresponds to a \"low-regret\" measure.","more":"UBA (2015), supplemented by EBP"},{"value":"low","desc":"The measure is effective only under one specific emission scenario (e.g. only RCP 2.6) or, in the worst case, even has negative effects under one of the emission scenarios (\"regret\" measure).","more":"UBA (2015), supplemented by EBP"}]},{"header":"Remark on robustness","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Sustainability (interactions)","def":"Qualitative assessment of whether the measure takes the best possible account of balancing all interests (economy, ecology, society) and enables a lastingly environmentally and socially equitable development of society","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure largely takes account of balancing all interests (economy, ecology and society) and enables a lasting environmentally and socially compatible development of society.","more":"UBA (2015)"},{"value":"medium","desc":"The measure partly takes account of balancing all interests (economy, ecology and society) and partly enables a lasting environmentally and socially compatible development of society.","more":"UBA (2015)"},{"value":"low","desc":"The measure only takes limited account of balancing all interests (economy, ecology and society) and only to a limited extent enables a lasting environmentally and socially compatible development of society.","more":"UBA (2015)"}]},{"header":"Remark on sustainability","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Financial feasibility (efficiency, implementability)","def":"Qualitative assessment of whether the adaptation measure can be financed by those implementing it at reasonable expense and whether alternative measures offer no greater benefit at the same cost.","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure can be financed at reasonable expense and there are no alternative measures that offer a greater benefit at the same cost.","more":"UBA (2015)"},{"value":"medium","desc":"The measure can be financed only at high expense and there are no alternative measures that offer a greater benefit at the same cost.","more":"UBA (2015)"},{"value":"low","desc":"The measure can be financed only at high expense and there are alternative measures that offer a greater benefit.","more":"UBA (2015)"}]},{"header":"Remark on financial feasibility","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Positive side effects","def":"Qualitative assessment of whether, in addition to adapting to climate change, the measure has further positive effects on the environment, on society or for the implementing organisation and the achievement of its objectives. These also take effect in the absence of climate change.","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure has very positive effects on the target group, the environment or society (irrespective of the climate change that occurs).","more":"UBA (2015)"},{"value":"medium","desc":"The measure has positive effects on the target group, the environment or society (irrespective of the climate change that occurs).","more":"UBA (2015)"},{"value":"low","desc":"The measure has only minor positive effects on the target group, the environment or society (irrespective of the climate change that occurs).","more":"UBA (2015)"}]},{"header":"Remark on positive side effects","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Flexibility","def":"Qualitative assessment of whether the measure can be modified at proportionately low cost.","more":"according to UBA 2015, see worksheet \"Lists\"","options":[{"value":"high","desc":"The measure can be modified at proportionately low cost.","more":"UBA (2015)"},{"value":"medium","desc":"The measure can be modified at proportionately moderate cost.","more":"UBA (2015)"},{"value":"low","desc":"The measure can be modified only at proportionately high cost.","more":"UBA (2015)"}]},{"header":"Remark on flexibility","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Avoidance of conflicting objectives with climate change mitigation and adaptation","def":"Qualitative assessment of whether the measure may lead to a negative effect on climate change mitigation or climate adaptation.","more":"Addition from the discussion with the advisory group of 2 May 2024; https://www.sciencedirect.com/topics/neuroscience/maladaptation","options":[{"value":"high","desc":"The measure shows no conflicting objectives with climate change mitigation or with other aspects of climate adaptation and does not lead to maladaptation.","more":""},{"value":"medium","desc":"The measure shows some conflicting objectives with climate change mitigation or with other aspects of climate adaptation and may lead to minor maladaptation if this is not taken into account during implementation.","more":""},{"value":"low","desc":"The measure shows conflicting objectives with climate change mitigation or with other aspects of climate adaptation and may lead to maladaptation if this is not taken into account during implementation.","more":""}]},{"header":"Remark on avoidance of conflicting objectives with climate change mitigation and adaptation","def":"Comment field for additional information on the assessment","more":"","options":[]},{"header":"Particular relevance of the measure for vulnerable groups","def":"Vulnerable groups benefit particularly from this measure","more":"see worksheet \"Lists\"","options":[]},{"header":"Possible impacts on distributional equity","def":"Qualitative assessment of whether the measure could have social justice implications (e.g. effect on vulnerable groups)","more":"according to Social Justice PPT + MOOC of Harvard University\n«The Health Effects of Climate Change»","options":[{"value":"high","desc":"Strong impacts on distributional equity, incl. direct cost impact for vulnerable groups","more":""},{"value":"medium","desc":"Moderate impacts on distributional equity, incl. impacts for vulnerable groups, not necessarily at the level of costs","more":""},{"value":"low","desc":"Hardly any impacts on distributional equity, incl. for vulnerable groups","more":""}]},{"header":"Remark on distributional equity","def":"Comment on those affected and/or vulnerable groups","more":"according to Social Justice PPT + MOOC of Harvard University\n«The Health Effects of Climate Change»","options":[]},{"header":"Comments","def":"Comment field for further remarks and notes","more":"","options":[]},{"header":"Source of the measure","def":"Source reference for the measure and further information","more":"","options":[]}],"rows":[["B_Bev_KliGeb_HI-Ges_1","HI-Ges","Federal level (federal offices)","entire population","Summer heat protection (buildings)","Research","Inclusion of the challenge of «greater heat stress» in the 2020–2023 research programme","Development of the research programme with a view to the risks of greater heat stress. The development is accompanied by a stakeholder process and is subsequently approved by the competent Federal Housing Commission (FHC). When implementing specific research projects, the federal construction and property bodies (FOBL, armasuisse, ETH Board) are involved in project supervision where this makes sense.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","The effects of heat are considered and addressed directly, which has a positive effect on sustainability.","high","na","high","Research can reduce the negative effects of heat on health and provide particular protection for vulnerable persons.","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","high","Research can reduce the negative effects of heat on health and provide particular protection for vulnerable persons. Stakeholder processes must in particular take account of the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Schweizerische Eidgenossenschaft (2020), AP2-wo1"],["B_Bev_KliGeb_HI-Ges_2","HI-Ges","Federal level (federal offices)","entire population","Summer heat protection (buildings)","Communication","Cooling energy demand in the building sector: provision of information and monitoring of the situation","Responsibility in the building sector lies with the cantons. The SFOE takes on a mediating role and supports knowledge building by providing information and study results on the topic of cooling energy demand in the building sector. The SFOE also monitors the situation, among other things by analysing energy consumption by intended use.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","medium","Additional cooling harms the environment, as more energy is required.","high","na","medium","Synergies with the risks of impairment of human health and increase in cooling energy demand","high","na","medium","There is a conflict of objectives with climate change mitigation due to the higher energy demand for cooling. The energy supply for the cooling systems should be covered by renewable energies.","none","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Schweizerische Eidgenossenschaft (2020), AP1-e1"],["B_ÖffHand_KliGeb_HI-Ges_1","HI-Ges","Federal level (federal offices)","Public authorities","Summer heat protection (buildings)","Structural measures","Consideration of local climate aspects in new builds and conversions as well as site developments of the Confederation","Where new builds and conversions of the Confederation take place in areas that are already under local climatic stress or in the area of an important ventilation corridor, the local climate criterion is taken into account in an appropriate manner.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","medium","na","none","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Kanton Zürich (2018), K9; Kanton Freiburg (2021), S.5.2, adapted to federal level"],["B_ZivGes_KliGeb_HI-Ges_1","HI-Ges","Federal level (federal offices)","Civil society","Summer heat protection (buildings)","Basic studies and strategies","Production of climate scenario data sets with high temporal resolution","Creation of a Switzerland-wide quantitative basis in order to translate the findings of the Swiss climate scenarios (AP1-wg1) optimally into practical applications, e.g. building simulations, standard definitions, adaptation measures, etc. The new data sets are developed in cooperation with experts from practice. This ensures that the new data meet user needs.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","The bases developed support optimal planning of the further measures for various actors","high","na","high","Synergies with the risks of impairment of human health and increase in cooling energy demand","high","na","high","na","none","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Schweizerische Eidgenossenschaft (2020), AP2-wg5"],["B_ÖffHand_Lokalkl_HI-Ges_1","HI-Ges","Federal level (federal offices)","Public authorities","Urban planning measures (local climate)","Structural measures","Consideration of local climate aspects in outdoor design and site developments of the Confederation","Where new builds and conversions of the Confederation take place in areas that are already under local climatic stress or in the area of an important ventilation corridor, the local climate criterion is taken into account in an appropriate manner.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","medium","na","none","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events, storm and hail events","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Kanton Zürich (2018), K9; SwissTPH (2021), adapted to federal level"],["B_U_Lokalkl_HI-Ges_1","HI-Ges","Federal level (federal offices)","Private sector","Urban planning measures (local climate)","Communication","Information for and awareness raising among planners","Topics such as risk-based spatial planning, heat in cities, heavy precipitation and storm and hail events in cities are well prepared and made available to spatial planning actors at all levels at information, experience-sharing and knowledge-sharing events. In addition to events, specialist articles are also written for specialist journals.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events, storm and hail events","high","na","high","na","none","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Schweizerische Eidgenossenschaft (2020), AP1-r4"],["B_Bev_SchBev_Hi-Ges_1","HI-Ges","Federal level (federal offices)","entire population","Protection of the population against heat","Basic studies and strategies","Monitoring of morbidity and mortality","During the summer, morbidity and mortality patterns are monitored and analysed (e.g. number of emergency admissions stratified by age group and data on fever >38°C in the canton of VD, heat-related emergency hospital admissions in the canton of TI). This provides an overview of the current situation and enables efficient planning of measures. The data can be used when assessing the danger level of the heatwave and drawn on for further analyses (e.g. heat-related excess mortality). For the preparation and analysis of the data, advice from or the involvement of specialists (e.g. a research institute) is recommended.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH (2021), measure 18"],["B_Bev_SchBev_Hi-Ges_2","HI-Ges","Federal level (federal offices)","entire population","Protection of the population against heat","Communication","Information and recommendations on protection against heat (FOPH)","Website with information and background material on the topic of heat","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","in high","na","high","na","none","low","na","Research: the Swiss hail measurement network - Mobiliar Lab for Natural Risks","based on Schweizerische Eidgenossenschaft (2020), AP1-n1"],["B_Bev_PrävSH_SH-Schäd_2","SH-Schäd","Federal level (federal offices)","entire population","Prevention of storm and hail events","Basic studies and strategies","Revision of the storm damage manual","Update of the existing manual published by the FOEN in 2008 following the storm damage caused by \"Lothar\"","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","Research: the Swiss hail measurement network - Mobiliar Lab for Natural Risks","Schweizerische Eidgenossenschaft (2020), AP2-f5"],["B_Bev_PrävSH_SH-Schäd_3","SH-Schäd","Federal level (federal offices)","entire population","Prevention of storm and hail events","Basic studies and strategies","Production of a hail climatology for Switzerland and improvement of the (long-term) data basis","Establishment of a uniform, accepted, consistent hail climatology and assurance of the long-term provision of this comprehensive hail hazard data","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","Research: the Swiss hail measurement network - Mobiliar Lab for Natural Risks","Schweizerische Eidgenossenschaft (2020), AP1-wg2"],["B_Bev_PrävNG_HW-Schäd_2","HW-Schäd","Federal level (federal offices)","entire population","Natural hazard prevention","Basic studies and strategies","Analysis of significant events and of the management of natural hazard risks","a) Hazard and risk data, concepts and principles for dealing with natural hazard risks, the effectiveness of measures to manage risks and the legal and strategic bases are reviewed periodically and updated where necessary. b) Only with an adequate evaluation can events and deployments be analysed and compared. In order to analyse individual deployments comparably, a basis for event analysis is necessary. The analysis is central to continuously improving deployments and emergency measures and adapting them to circumstances. c) The event analyses of serious adverse events represent an overall view of all those affected. d) When preparing event analyses, climate-relevant factors are also addressed in order to adapt measures to changed conditions. e) Depending on the event, the appropriate body takes the lead. f) All events are recorded in the event database (StorMe).","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n7"],["B_Bev_PrävNG_HW-Schäd_3","HW-Schäd","Federal level (federal offices)","entire population","Natural hazard prevention","Basic studies and strategies","Know the hazards and risks","National and cantonal hazard analyses are currently carried out at federal level as well as at cantonal level. These hazard analyses assess the hazard potential of specific hazard scenarios with regard to adaptation to climate change. They form the basis for precautionary planning. The analysis makes it possible to identify deficits and to derive and coordinate prevention and precautionary measures. Activities: a) Consistent and regular updating of the hazard data (in order to capture changes in good time), extension to areas outside settlement areas. b) Provision of hazard data that has been missing or needs to be completed (e.g. for tsunamis or a hazard map for surface runoff). c) Consistent provision of the existing hazard data. d) Comprehensive and systematic risk assessment. Identification of critical infrastructure (e.g. electricity supply, supply and disposal, etc.) and special facilities (e.g. schools, hospitals) of national importance in the hazard area.","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n2"],["B_Bev_PrävNG_HW-Schäd_4","HW-Schäd","Federal level (federal offices)","entire population","Natural hazard prevention","Communication","Transfer of knowledge on the effects of climate change on emergency response concepts","Knowledge about the possible effects of climate change on natural hazards is passed on regularly to those responsible and integrated into emergency response concepts. The effects of climate change can thus be taken into account in emergency concepts and planning in good time.","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n5"],["B_Bev_PrävSH_SH-Schäd_4","SH-Schäd","Federal level (federal offices)","entire population","Prevention of storm and hail events","Communication","Transfer of knowledge on the effects of climate change on emergency response concepts","Knowledge about the possible effects of climate change on storm and hail events is passed on regularly to those 5","SH-Schäd","Federal level (federal offices)","entire population","Prevention of storm and hail events","Requirements","Integration within SIA standardisation","Consideration of information on storm and hail events and climate change in SIA standardisation","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risk of property damage due to heavy precipitation","high","na","high","na","none","low","na","na","Stakeholder workshop 1, Nov 2023"],["B_Bev_RisikRP_HW-Schäd_1","HW-Schäd","Federal level (federal offices)","entire population","Risk-based spatial planning","Requirements","Adaptation of national spatial planning legislation","Information on possible natural hazards and risks should be taken into account early in the spatial planning process, and the existing spatial planning instruments such as structure planning, land-use planning and special land-use planning should be used in a targeted way for risk management. In the course of revisions of the legislation, the principles of risk-based land use should be enshrined and the possibilities for implementing spatial planning measures to protect against natural hazards and climate-related changes should be strengthened. By drawing up guidelines for risk-based spatial development, coordination between area protection measures, property protection measures (building requirements) and settlement development should be ensured. It must also be ensured that private individuals are informed about the current hazard situation and the possible climate-related changes as well as about possible protective measures such as property protection (strengthening individual responsibility). In extreme cases this may result in relocations.","planned adaptation","whole of Switzerland","  of the monitoring of quarantine organisms in imports.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","medium","na","positive impacts","na","high","na","high","By reducing the use of plant protection products, the measure has a positive influence on the environment.","high","na","high","Reducing the use of plant protection products improves human and animal health.","high","na","high","na","none","low","","na","Schweizerische Eidgenossenschaft (2020), AP1-l1"],["B_U_PrävSchad_SO-Landw_1","SO-Landw","Federal level (federal offices)","Private sector","Prevention of harmful organisms","Basic studies and strategies","Expansion of monitoring and early warning of pest spread","Mapping of the effects of climate change on agricultural production and of progress in adaptation. Information on weather-dependent parameters (including soil water status, erosion and compaction risk, heat stress, pest spread) to support the optimal timing of management measures. Compilation of the existing offerings and information, analysis of needs and identification of gaps regarding monitoring and early warning in relation to agriculture, expansion of existing monitoring systems, establishment of a central national coordination, administration and publication office, definition of critical threshold values. Development of regionally differentiated traffic-light systems and generation of up-to-date management recommendations, development of decision aids for the short-term issuing of orders.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","medium","na","positive impacts","positive impact on agricultural yields","high","The monitoring supports the targeted implementation of suitable measures for all emission scenarios.","high","Sustainability is assured and supports the optimal implementation of specific measures for the environment and enables the corresponding yield for agriculture.","high","There are no alternatives and the measure can be implemented with reasonable effort.","high","Monitoring and early warning help to implement appropriate measures at an early stage and thus generate positive side effects for the environment and agriculture (see sustainability).","high","Monitoring and early detection can be adapted and developed further as required and with little effort.","high","The bases have no conflicting objectives and make it possible to identify possible weak points and conflicts of objectives in other measures.","none","low","Measures should take account of vulnerable groups (e.g. people with low socio-economic status) and their needs. Financial support for low-income farmers may be necessary here.","na","Schweizerische Eidgenossenschaft (2020), AP1-l4"],["B_Bev_BekSchad_SO-Wald_1","SO-Wald","Federal level (federal offices)","entire population","Control of harmful organisms","Basic studies and strategies","Minimisation of mass outbreaks of bark beetles and other harmful organisms and of the damage they cause","Intensified measures are intended to dampen secondary damage resulting from mass outbreaks of bark beetles. Together with the cantons, the Confederation should ensure that the control of beetle damage and other harmful organisms is coordinated. This requires new concepts and silvicultural measures. The basis includes scientifically and silviculturally sound concepts still to be developed that extend existing measures in practice. Unsuitable forest stands must be converted as efficiently as possible through progressive interventions, taking account of ongoing climate change, to tree species adapted to climate change. Natural methods of controlling harmful organisms are promoted. Statistical monitoring of harmful organisms and all information resources for forest owners and forestry staff are maintained or even improved: http://www.bostryche.ch","planned ble farm managers to recognise their exposure to external shocks and to analyse and assess their risk situation and resilience. Provide guidance on options for action to improve resilience and reduce vulnerability.","planned adaptation","whole of Switzerland","national","Reduced revenue losses","indirect impact","no","no","na","low","na","low","na","medium","na","positive impacts","positive impact on agricultural yields","high","Risk hedging takes effect when needed and is therefore relevant for all emission scenarios.","high","Risk hedging primarily supports farmers at the economic level and addresses potentially existence-threatening liquidity shortages. This also prevents any social impacts on employees.","high","Risk hedging provides support when needed and can therefore be implemented to an appropriate extent.","high","Risk hedging has positive effects on farms with regard to protection in the event of damage; synergy with the Climate Strategy for Agriculture and Food 2025","high","Risk hedging can be reviewed and adjusted on an ongoing basis.","high","na","none","high","This measure should be aimed specifically at securing farmers' livelihoods.","na","Schweizerische Eidgenossenschaft (2020), AP1-l5"],["B_U_Wasskraft_TR-Strom_1","TR-Strom","Federal level (federal offices)","Private sector","Securing hydropower production","Communication","Provision of information and monitoring of the situation regarding hydropower use","The SFOE takes on a mediating role and supports knowledge building on this topic by making study results and further information available. The SFOE also monitors the seasonal shift in water runoff and takes it into account in the Energy Perspectives.","planned adaptation","whole of Switzerland","national","Reduced revenue losses","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","na","high","Information is relevant for all emission scenarios.","high","Information supports the consideration of sustainabili rated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 13"],["Gmd_ZivGes_SchBev_HI-Ges_1","HI-Ges","Municipal level (municipalities)","Civil society","Protection of the population against heat","Communication","Awareness-raising campaigns for sports clubs and youth associations","Sports and youth associations should be careful when training outdoors. This applies to all age groups, but especially to older people doing sport. Behavioural recommendations, information on the symptoms of heat effects and instructions for action in crisis situations are important.","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Children, incl. infants in particular","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 7"],["Gmd_ÖffHand_KliGeb_HI-Kühl_1","HI-Kühl","Municipal level (municipalities)","Public authorities","Summer heat protection (buildings)","Structural measures","Consideration of local climate aspects in municipal new builds and conversions as well a ncrease in cooling energy demand, heavy rainfall events","high","na","high","na","none","low","na","na","Kanton Zürich (2018), K8"],["Gmd_TeilBev_KliGeb_HI-Kühl_2","HI-Kühl","Municipal level (municipalities)","part of the population","Summer heat protection (buildings)","Communication","Information programme on climate-adapted building design and building technology","Development of basic information on the heat emission of different roof and façade surfaces, optimisation of standards and regulations on summer heat protection and on taking future climate developments into account in the various areas of building services engineering. Clients, investors and specialist planners are made aware of options for mitigating the urban heat island effect and improving summer heat protection.","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","indirect impact","no","no","na","low","na","none","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, loss of performance at work","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","na","Kanton Zürich (2018), K5"],["Gmd_ÖffHand_Lokalkl_HI-Kühl_1","HI-Kühl","Municipal level (municipalities)","Public authorities","Urban planning measures (local climate)","Structural measures","Consideration of local climate aspects in municipal outdoor design and site developments","Where municipal new builds and conversions take place in areas that are already under local climatic stress or in the area
