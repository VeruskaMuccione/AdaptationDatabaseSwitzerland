operty bodies (FOBL, armasuisse, ETH Board) are involved in project supervision where this makes sense.","autonomous adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","The effects of heat are considered and addressed directly, which has a positive effect on sustainability.","high","na","high","Research can reduce the negative effects of heat on health and provide particular protection for vulnerable persons.","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","high","Research can reduce the negative effects of heat on health and provide particular protection for vulnerable persons. Stakeholder processes must in particular take account of the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Schweizerische Eidgenossenschaft (2020), AP2-wo1"],["Uni_Bev_SchBev_HI-Ges_1","HI-Ges","Universities/universities of applied sciences","entire population","Protection of the population against heat","Communication","Basic, further and continuing education of health care staff","Provision of basic, further and continuing education courses, online training courses and lectures for universities, health care institutions and other interested institutions.","autonomous adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of loss of performance at work","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","In basic, further and continuing education, the needs of vulnerable groups (e.g. the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors) are to be taken into account and awareness of their vulnerability specifically raised.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 3"],["Uni_Bev_SchBev_Hi-Ges_2","HI-Ges","Universities/universities of applied sciences","entire population","Protection of the population against heat","Research","Monitoring of morbidity and mortality","During the summer, morbidity and mortality patterns are monitored and analysed (e.g. number of emergency admissions stratified by age group and data on fever >38°C in the canton of VD, heat-related emergency hospital admissions in the canton of TI). This provides an overview of the current situation and enables efficient planning of measures. The data can be used when assessing the danger level of the heatwave and drawn on for further analyses (e.g. heat-related excess mortality). For the preparation and analysis of the data, advice from or the involvement of specialists (e.g. a research institute) is recommended.","autonomous adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","high","Here, data should in particular also be collected on particularly vulnerable groups (e.g. the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors) in order to identify disproportionate risk and disproportionate impacts for these groups.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH (2021), measure 18"],["Uni_Bev_KliGeb_HI-Kühl_1","HI-Kühl","Universities/universities of applied sciences","entire population","Summer heat protection (buildings)","Research","Inclusion of the challenge of «greater heat stress» in the 2020–2023 research programme","Development of the research programme with a view to the risks of greater heat stress. The development is accompanied by a stakeholder process and is subsequently approved by the competent Federal Housing Commission (FHC). When implementing specific research projects, the federal construction and property bodies (FOBL, armasuisse, ETH Board) are involved in project supervision where this makes sense.","autonomous adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","The effects of heat are considered and addressed directly, which has a positive effect on sustainability.","high","na","high","R n according to more recent reports)","low","CHF 20,000-100,000 operating costs per km of snowmaking system","high","https://pubdb.bfe.admin.ch/de/publication/download/4764#:~:text=Ein%20Kilometer%20Beschneiungsanlage%20kostet%20700,Standards%20f%C3%BCr%20Energie%2D%20und%20Wassereffizienz.","very positive impacts","Stimulus for the continuation of ski tourism in Switzerland; spillover effects from neighbouring countries, as there is less snow there.","high","na","medium","The high water and energy consumption places a burden on the environment (ecology). In addition, nature and landscape protection is threatened by increased snowmaking.","medium","Depending on the altitude of the area, it should be carefully examined whether investments in new snowmaking systems are still worthwhile.","medium","Artificial snowmaking also enables an eventful winter for the target group in the long term. On the other hand, it has effects on the environment and on the economy (energy and water costs, nature and landscape protection) that should not be underestimated. Careful planning and implementation must therefore be observed.","low","Investments in artificial snowmaking cannot be modified so easily.","low","Artificial snowmaking shows clear conflicts of objectives with climate change mitigation (energy consumption) and with climate adaptation (water consumption). However, snowmaking can also store volumes of water over the winter that flow down into the valley in spring, thus supporting a broader distribution of water runoff from the Alps as well as water storage in groundwater.","- People with low socio-economic status","low","Investments to improve the offering must not be made at the expense of vulnerable groups. The focus here is above all on low-income households.","It should be examined at which altitudes investment in artificial snowmaking really makes sense. This varies greatly from region to region (microclimate, orientation of the ski area) and can therefore only be deter d tourism, making the shoulder season more attractive, weather- and season-independent offerings (incl. alternative winter offerings), e.g. winter hiking trails, mountain bike trails, toboggan runs, indoor facilities, etc.)","autonomous adaptation","whole of Switzerland","local","Increased adaptive capacity","direct, high impact","yes","yes","Investment measures that have a direct influence on revenue in tourism.","high","Bike trail (flow trail): CHF 150,000 (1.1 km) - CHF 690,000 (7.5 km) --> approx. CHF 100,000 per km","medium","na","high","Neuer Biketrail für Einsteigerinnen und Einsteiger am Uetliberg - Stadt Zürich (stadt-zuerich.ch)\nhttps://www.suedostschweiz.ch/tourismus/2018-10-01/der-690000-franken-flowtrail-in-glarus-kann-kommen","positive impacts","New investments lead to more value added in construction as well as in tourism","high","Adapting the tourism offering enables more flexible marketing and thus increases robustness irrespective of the emission scenario.","medium","New infrastructure facilities have an influence on the environment (ecology). This must be observed during implementation.","medium","The investments are high; whether there are alternatives must be examined for the specific projects.","medium","The influence of new infrastructure must be taken into account in particular with regard to the environment (nature and landscape protection). On the economic side, it strengthens peripheral regions with tourism potential.","low","Infrastructure is expensive and cannot be adapted quickly. This must be taken into account when adapting the infrastructure.","low","New facilities could lead to increased energy consumption and thus counteract climate change mitigation. This is to be examined during authorisation. With regard to climate adaptation, it must also be examined what influence any facilities have on aspects of climate adaptation such as biodiversity or the landscape.","- People with low socio-economic status","low","Investments to improve the offering must not be made at the expense of vulnerable groups. The focus here is above all on low-income households.\nInvestments in tourism infrastructure should be designed to be inclusive and accessible for all population groups.","na","Stakeholder workshop 1, Nov 2023"],["U_TeilBev_TourAng_SFG-Ertrag_1","SFG-Ertrag","Private sector","part of the population","Adapting the tourism offering","Structural measures","Investments in new snow sports facilities at high altitudes","Construction of new facilities to expand the snow sports offering at high altitudes","autonomous adaptation","Alps","regional","Increased adaptive capacity","direct, high impact","yes","yes","Investment measure that has a direct influence on revenue in tourism.","medium","Simple ski lift from approx. CHF 200,000, larger aerial tramways approx. CHF 30 million, new chairlift approx. CHF 8-12 million","medium","8-seater chairlift approx. CHF 380,000 per season (140 operating days)","high","Seilbahnbau | Seilbahnen Schweiz; https://www.handelszeitung.ch/unternehmen/seilbahnen-bilanzen-des-grauens; https://www.beobachter.ch/sites/default/files/fileadmin/dateien/skigrafik-final.pdf","very positive impacts","Stimulus for the continuation of ski tourism in Switzerland; spillover effects from neighbouring countries, as there is less snow there","high","na","low","New infrastructure facilities in still untouched, high-altitude areas have a major influence on the environment (ecology). There is strong resistance from environmental organisations, and objections create hurdles for the implementation of such projects. This must be observed during implementation.","medium","The financing requirement is very high and implementability is unclear (see sustainability). Alternative measures exist to a limited extent (forgoing the expansion of facilities and concentrating on the existing infrastructure)","medium","Expanding the facilities also enables an eventful snow sports offering for the target group in th const MAC = {"very negative impacts":-2, "negative impacts":-1, "neutral impacts":0, "positive impacts":1, "very positive impacts":2};

function meter(n, tone = "ink", kind = "") {
  let inner;
  if (kind === "indirect") inner = '<path class="dash" d="M2 13C7 3 19 3 24 13"/>';
  else if (n == null) inner = [0,1,2].map(i => `<rect class="na" x="${i*9+.5}" y="${10.5-i*5}" width="6" height="${5+i*5}"/>`).join("");
  else inner = [0,1,2].map(i => `<rect class="${i < n ? "on" : "off"}" x="${i*9}" y="${10-i*5}" width="7" height="${6+i*5}" rx="1"/>`).join("");
  return `<svg class="meter t-${tone}" viewBox="0 0 26 16" aria-hidden="true">${inner}</svg>`;
}
function macroMeter(v) {
  const p = MAC[v]; const tone = p == null ? "ink" : p < 0 ? "poor" : p > 0 ? "good" : "ink";
  return `<svg class="meter t-${tone}" viewBox="0 0 26 16" style="width:44px" aria-hidden="true">${[-2,-1,0,1,2].map((k,i) =>
    `<circle cx="${3+i*5}" cy="8" r="${k===p?2.5:1.6}" ${k===p?'class="on"':'fill="none" stroke="var(--muted)" stroke-width=".8"'}/>`).join("")}</svg>`;
}
const TONE3 = {high:"good", medium:"mid", low:"poor"};
/* glyph for a value in a given column */
function glyph(col, v, toned) {
  const k = String(v).toLowerCase();
  if (col === C.risk) return `<span style="color:var(--hz-${hz(v)})">${icon(RISKS[v]?.icon)}</span>`;
  if (col === C.actor) return icon(ACTOR_ICON[v]);
  if (col === C.eff) return k in EFF ? meter(EFF[k], "ink", EFF[k] === 0 ? "indirect" : "") : meter(null);
  if (col === C.avoid) return k in AVO ? meter(AVO[k], "ink", AVO[k] === 0 ? "indirect" : "") : meter(null);
  if (col === C.macro) return macroMeter(k);
  if (col === C.qImp || col === C.qCost) return icon(k === "yes" ? "check" : "dash");
  if ([C.inv, C.op, C.equity].includes(col)) return k in L3 ? meter(L3[k]) : meter(null);
  if ([C.robust, C.sustain, C.feas, C.side, C.flex, C.conflict].includes(col)) return k in L3 ? meter(L3[k], toned ? TONE3[k] : "ink") : meter(null);
  return "";
}

/* ---------- prepare rows ---------- */
const sortedRefs = [...REFS].sort((a, b) => b.key.length - a.key.length);
const ROWS = DATA.rows.map((r, i) => {
  for (const col in NORMALISE) if (NORMALISE[col][r[col]]) r[col] = NORMALISE[col][r[col]];
  let src = r[C.source] + "\n" + r[C.costSrc];
  for (const a in REF_ALIAS) src = src.split(a).join(REF_ALIAS[a]);
  const refs = [];
  for (const ref of sortedRefs) {
    let hit = false;
    for (const needle of [ref.key, ref.url, ref.linkText]) if (needle && needle.length > 5 && src.includes(needle)) { hit = true; src = src.split(needle).join(" "); }
    if (hit) refs.push(ref.key);
  }
  if (/SwissTPH/.test(src) && !refs.includes("SwissTPH (2021)") && REFS.some(x => x.key === "SwissTPH (2021)")) refs.push("SwissTPH (2021)");
  return {i, r, hz: hz(r[C.risk]), refs,
    text: [r[C.id], r[C.title], r[C.desc], r[C.pack], r[C.cat], r[C.actor], r[C.source], riskName(r[C.risk])].join(" ").toLowerCase(),
    eff: EFF[r[C.eff].toLowerCase()] ?? -1, inv: L3[r[C.inv].toLowerCase()] ?? 9, op: L3[r[C.op].toLowerCase()] ?? 9, avo: AVO[r[C.avoid].toLowerCase()] ?? -1,
    chf: has(r[C.capex]) || has(r[C.opex]), vuln: has(r[C.vuln]), quant: r[C.qImp] === "yes" || r[C.qCost] === "yes"};
});
const refCount = {}; ROWS.forEach(x => x.refs.forEach(k => refCount[k] = (refCount[k] || 0) + 1));

/* ---------- state ---------- */
const FACETS = [
  {col:C.risk, label:"Climate risk", open:true}, {col:C.actor, label:"Who implements it", open:true}, {col:C.target, label:"Who benefits"},
  {col:C.pack, label:"Package of measures"}, {col:C.cat, label:"Category of measure"}, {col:C.adapt, label:"Planned or autonomous"},
  {col:C.reach, label:"Impact reach"}, {col:C.type, label:"Type of impact"}, {col:C.eff, label:"Effectiveness"},
  {col:C.inv, label:"Investment costs"}, {col:C.op, label:"Annual operating costs"}, {col:C.avoid, label:"Avoided annual damage costs"}
];
const FLAGS = [["quant","Impact or costs can be quantified"], ["chf","Has cost figures in CHF"], ["vuln","Particularly relevant for vulnerable groups"]];
const S = {f:{}, flags:new Set(), q:"", sort:"table", view:"cards", ref:""};
FACETS.forEach(f => S.f[f.col] = new Set());
const openFacets = new Set(FACETS.filter(f => f.open).map(f => f.col));

function pass(x, skipCol) {
  for (const f of FACETS) { if (f.col === skipCol) continue; const set = S.f[f.col]; if (set.size && !set.has(x.r[f.col])) return false; }
  for (const fl of S.flags) if (!x[fl]) return false;
  if (S.ref && !x.refs.includes(S.ref)) return false;
  if (S.q) for (const w of S.q.toLowerCase().split(/\s+/)) if (w && !x.text.includes(w)) return false;
  return true;
}
function facetValues(f) {
  const counts = {}; ROWS.forEach(x => { if (pass(x, f.col)) counts[x.r[f.col]] = (counts[x.r[f.col]] || 0) + 1; });
  const all = new Set(ROWS.map(x => x.r[f.col]));
  let order = COLS[f.col].options.map(o => o.value).filter((v, i, a) => all.has(v) && a.indexOf(v) === i);
  [...all].filter(v => !order.includes(v)).sort().forEach(v => order.push(v));
  if (f.col === C.risk) { const keys = Object.keys(HAZARDS); order.sort((a, b) => keys.indexOf(hz(a)) - keys.indexOf(hz(b))); }
  return order.map(v => ({v, n: counts[v] || 0}));
}
const SORTS = {
  table:["Order of the table", (a, b) => a.i - b.i],
  eff:["Most effective first", (a, b) => b.eff - a.eff || b.avo - a.avo || a.i - b.i],
  avo:["Most damage avoided first", (a, b) => b.avo - a.avo || b.eff - a.eff || a.i - b.i],
  inv:["Lowest investment first", (a, b) => a.inv - b.inv || a.op - b.op || a.i - b.i],
  op:["Lowest operating costs first", (a, b) => a.op - b.op || a.inv - b.inv || a.i - b.i],
  az:["Title A to Z", (a, b) => a.r[C.title].localeCompare(b.r[C.title])]
};
const current = () => ROWS.filter(x => pass(x)).sort(SORTS[S.sort][1]);

/* ---------- views ---------- */
const app = document.getElementById("app");
const badge = r => `<span class="badge" style="--c:var(--hz-${hz(r)})">${icon(RISKS[r]?.icon)}${esc(riskName(r))}</span>`;

function viewStart() {
  const n = id => ROWS.filter(x => x.r[C.risk] === id).length;
  const byHz = {}; Object.keys(RISKS).forEach(id => { if (n(id)) (byHz[hz(id)] ||= []).push(id); });
  ROWS.forEach(x => { if (!RISKS[x.r[C.risk]]) { RISKS[x.r[C.risk]] = {short:x.r[C.risk]}; (byHz[x.hz] ||= []).push(x.r[C.risk]); } });
  const actors = facetValues({col:C.actor}).map(o => o.v);
  app.innerHTML = `<div class="wrap">
    <section class="hero">
      <h1>Which measures fit your climate risk?</h1>
      <div class="lede">${DATA.intro.paragraphs.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    </section>
    <section class="picker" aria-label="Choose your situation">
      <h2>Which climate risk are you working on?</h2>

        ${byHz[h].map(id => `<button class="tile" data-pick="${C.risk}" data-v="${esc(id)}" aria-pressed="${S.f[C.risk].has(id)}" title="${esc(optDesc(C.risk, id))}">${icon(RISKS[id].icon)}<span>${esc(RISKS[id].short)}</span><span class="n">${n(id)}</span></button>`).join("")}</div>`).join("")}</div>
      <hr>
      <h2>Who implements the measure?</h2>
      <p class="hint">Optional.</p>
      <div class="actors">${actors.map(a => `<button class="tile" data-pick="${C.actor}" data-v="${esc(a)}" aria-pressed="${S.f[C.actor].has(a)}" title="${esc(optDesc(C.actor, a))}">${icon(ACTOR_ICON[a])}<span>${esc(a.replace(/\s*\(.*\)$/, ""))}</span></button>`).join("")}</div>
      <div class="go"><a class="btn" href="#measures" id="go"></a><button class="link" data-act="clear" id="startclear">Clear my choices</button></div>

    </div></div>`;
  updateGo();
}
function updateGo() {
  const go = document.getElementById("go"); if (!go) return;
  const n = ROWS.filter(x => pass(x)).length;
  go.textContent = `Show ${n} measure${n === 1 ? "" : "s"}`;
  document.getElementById("startclear").hidden = !(S.f[C.risk].size || S.f[C.actor].size);
}

function viewMeasures() {
  app.innerHTML = `<div class="wrap page">
    <h1>Measures</h1>
    <div class="layout">
      <details class="rail" id="rail" ${matchMedia("(max-width:900px)").matches ? "" : "open"}><summary>Filters</summary><div class="inner" id="facets"></div></details>

    </div></div>`;
  renderFacets(); renderResults();
}
function renderFacets() {
  const box = document.getElementById("facets"); if (!box) return;
  box.innerHTML = FACETS.map(f => {
    const vals = facetValues(f); let last = "";
    return `<details class="facet" data-facet="${f.col}" ${openFacets.has(f.col) || S.f[f.col].size ? "open" : ""}><summary>${esc(f.label)}${S.f[f.col].size ? ` (${S.f[f.col].size})` : ""}</summary><div class="opts">${vals.map(o => {
      let head = "";
      if (f.col === C.risk && hz(o.v) !== last) { last = hz(o.v); head = `<div class="optgroup" style="--c:var(--hz-${last})">${esc(HAZARDS[last] || last)}</div>`; }
      const label = f.col === C.risk ? (RISKS[o.v]?.short || o.v) : cap(o.v);
      return `${head}<label class="opt ${o.n ? "" : "zero"}" title="${esc(optDesc(f.col, o.v))}"><input type="checkbox" data-col="${f.col}" value="${esc(o.v)}" ${S.f[f.col].has(o.v) ? "checked" : ""}><span>${esc(label)}</span><span class="n">${o.n}</span></label>`;
    }).join("")}</div></details>`;
  }).join("") + `<details class="facet" data-facet="flags" ${openFacets.has("flags") || S.flags.size ? "open" : ""}><summary>More</summary><div class="opts">${FLAGS.map(([k, l]) =>
    `<label class="opt"><input type="checkbox" data-flag="${k}" ${S.flags.has(k) ? "checked" : ""}><span>${l}</span><span class="n">${ROWS.filter(x => x[k] && pass(x)).length}</span></label>`).join("")}</div></details>`;
}
const rate = (label, col, v) => `<div class="rate">${glyph(col, v)}<b>${esc(cap(v.replace(/^direct, | impact$/g, "")))}</b>${label}</div>`;
function renderResults() {
  const list = current(), st = document.getElementById("status"), out = document.getElementById("results"); if (!out) return;
  const chips = [];
  FACETS.forEach(f => S.f[f.col].forEach(v => chips.push(`<span class="chip">${esc(f.col === C.risk ? riskName(v) : cap(v))}<button data-rm="${f.col}" data-v="${esc(v)}" aria-label="Remove filter ${esc(v)}">×</button></span>`)));
  S.flags.forEach(k => chips.push(`<span class="chip">${FLAGS.find(x => x[0] === k)[1]}<button data-rmflag="${k}" aria-label="Remove filter">×</button></span>`));
  if (S.ref) chips.push(`<span class="chip">Cites ${esc(S.ref)}<button data-act="rmref" aria-label="Remove filter">×</button></span>`);
  st.innerHTML = `<span class="count">${list.length} of ${ROWS.length} measures</span>${chips.join("")}${chips.length || S.q ? `<button class="link small" data-act="clear">Clear all</button>` : ""}`;
  if (!list.length) { out.innerHTML = `<div class="empty"><p><b>No measures match these filters.</b></p><p class="muted">Remove a filter or shorten the search text.</p><button class="btn ghost" data-act="clear">Clear all filters</button></div>`; return; }
  if (S.view === "table") {
    const cols = [[C.eff,"Effectiveness"],[C.inv,"Investment"],[C.op,"Operating"],[C.avoid,"Avoided damage"],[C.robust,"Robustness"],[C.feas,"Feasibility"]];
    out.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Measure</th><th>Risk</th><th>Actor</th><th>Category</th>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${list.map(x => `<tr>
      <td style="min-width:260px"><button class="link" data-open="${x.i}">${esc(x.r[C.title])}</button></td><td style="min-width:150px">${badge(x.r[C.risk])}</td>
      <td>${esc(x.r[C.actor].replace(/\s*\(.*\)$/, ""))}</td><td>${esc(x.r[C.cat])}</td>
      ${cols.map(c => `<td><span class="mcell">${glyph(c[0], x.r[c[0]], true)}${esc(x.r[c[0]].replace(/^direct, | impact$/g, ""))}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  } else {
    out.innerHTML = `<div class="cards">${list.map(x => { const r = x.r; return `<button class="card" data-open="${x.i}" style="--c:var(--hz-${x.hz})">

      <span class="who">${icon(ACTOR_ICON[r[C.actor]])}<span>${esc(r[C.actor].replace(/\s*\(.*\)$/, ""))}, ${esc(r[C.cat].toLowerCase())}</span></span>
      ${x.chf || x.vuln ? `<span class="flags">${x.chf ? '<span class="flag">CHF figures</span>' : ""}${x.vuln ? '<span class="flag">Vulnerable groups</span>' : ""}</span>` : ""}
      <span class="rates">${rate("Effectiveness", C.eff, r[C.eff])}${rate("Investment", C.inv, r[C.inv])}${rate("Operating", C.op, r[C.op])}${rate("Avoided damage", C.avoid, r[C.avoid])}</span></button>`; }).join("")}</div>`;
  }
}

/* detail */
const dlg = document.getElementById("detail");
function fact(col, r) {
  const v = r[col]; if (!v) return "";
  const d = optDesc(col, v);
  return `<div><dt>${esc(COLS[col].header)}</dt><dd>${glyph(col, v)}<span>${esc(cap(v))}${d ? `<small>${esc(d)}</small>` : ""}</span></dd></div>`;
}
function crit(col, r, opts = {}) {
  const v = r[col], d = optDesc(col, v), rem = opts.rem != null ? r[opts.rem] : "";
  return `<div class="crit"><h4>${esc(opts.label || COLS[col].header)}</h4><div class="lv">${glyph(col, v, true)}${esc(cap(v))}</div>
    ${d ? `<p class="what">${esc(d)}</p>` : ""}${has(rem) ? `<p>${linkify(rem)}</p>` : ""}${opts.fig && has(r[opts.fig]) ? `<p class="fig"><b>${esc(COLS[opts.fig].header)}:</b> ${linkify(r[opts.fig])}</p>` : ""}</div>`;
}
function openDetail(i) {
  const x = ROWS[i]; if (!x) return; const r = x.r;

    <section><h3>Impact and costs</h3>

      ${has(r[C.costSrc]) ? `<p class="small pre" style="margin-top:14px"><b>${esc(COLS[C.costSrc].header)}:</b> ${linkify(r[C.costSrc])}</p>` : ""}
    </section>
    <section><h3>Assessment criteria</h3>${[C.robust, C.sustain, C.feas, C.side, C.flex, C.conflict].map(c => crit(c, r, {rem:c + 1})).join("")}</section>
    <section><h3>Vulnerable groups and distributional equity</h3>
      ${vuln.length ? `<p><b>Particularly relevant for</b></p><ul class="plain">${vuln.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : `<p class="muted">No particular relevance for vulnerable groups recorded.</p>`}

    <section><h3>Sources</h3><p class="pre">${linkify(r[C.source])}</p>
      ${refs.length ? `<ul class="reflist">${refs.map(f => `<li><b>${esc(f.key)}</b> ${esc(f.title)}${f.inst ? `, ${esc(f.inst)}` : ""}<br>${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">Open source ${icon("out")}</a>` : `<span class="muted">${esc(f.linkText)}</span>`}</li>`).join("")}</ul>` : ""}

    <p class="prose" style="margin-top:12px">Sources cited in the table of measures. Some measures also come from stakeholder workshops or from the project team’s own work; these are named on the page of the measure.</p>
    <div class="refs">${REFS.map((f, i) => `<article class="ref" id="ref-${i}"><div><h3>${esc(f.title)}</h3>
      <div class="k">${esc(f.key)}${f.inst ? `, ${esc(f.inst)}` : ""}${f.consulted ? `. Consulted on ${esc(f.consulted)}` : ""}</div>
      <div class="small" style="margin-top:6px">${f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.linkText.startsWith("http") ? f.url : f.linkText)} ${icon("out")}</a>` : `<span class="muted">${esc(f.linkText)}</span>`}</div></div>
      <div>${refCount[f.key] ? `<button class="btn quiet" data-ref="${esc(f.key)}">${refCount[f.key]} measure${refCount[f.key] === 1 ? "" : "s"}</button>` : ""}</div></article>`).join("")}</div></div>`;
}

/* ---------- routing ---------- */
let shown = "";
function route() {
  const h = location.hash.slice(1) || "start";
  const m = h.match(/^m-(\d+)$/);
  const view = m ? "measures" : ["start", "measures", "indicators", "references"].includes(h) ? h : "start";
  if (view !== shown) {
    ({start:viewStart, measures:viewMeasures, indicators:viewIndicators, references:viewReferences})[view]();
    shown = view; if (!m) scrollTo(0, 0);
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  }
  if (m) openDetail(+m[1]); else if (dlg.open) dlg.close();
}
function refresh() { if (shown === "measures") { renderFacets(); renderResults(); } else if (shown === "start") { shown = ""; route(); } }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-pick],[data-open],[data-rm],[data-rmflag],[data-act],[data-view],[data-ref]"); if (!t) { if (e.target === dlg) dlg.close(); return; }
  const d = t.dataset;
  if (d.pick) { const set = S.f[d.pick]; set.has(d.v) ? set.delete(d.v) : set.add(d.v); t.setAttribute("aria-pressed", set.has(d.v)); updateGo(); }
  else if (d.open) location.hash = "m-" + d.open;
  else if (d.rm) { S.f[d.rm].delete(d.v); refresh(); }
  else if (d.rmflag) { S.flags.delete(d.rmflag); refresh(); }
  else if (d.view) { S.view = d.view; document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view)); renderResults(); }
  else if (d.ref) { FACETS.forEach(f => S.f[f.col].clear()); S.flags.clear(); S.q = ""; S.ref = d.ref; location.hash = "measures"; }
  else if (d.act === "close") dlg.close();
  else if (d.act === "rmref") { S.ref = ""; refresh(); }
  else if (d.act === "clear") { FACETS.forEach(f => S.f[f.col].clear()); S.flags.clear(); S.q = ""; S.ref = ""; const q = document.getElementById("q"); if (q) q.value = ""; refresh(); }
  else if (d.act === "csv") downloadCsv();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.col) { t.checked ? S.f[t.dataset.col].add(t.value) : S.f[t.dataset.col].delete(t.value); refresh(); }
  else if (t.dataset.flag) { t.checked ? S.flags.add(t.dataset.flag) : S.flags.delete(t.dataset.flag); refresh(); }
  else if (t.id === "sort") { S.sort = t.value; renderResults(); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value.trim(); renderFacets(); renderResults(); } });
document.addEventListener("toggle", e => { const k = e.target.dataset?.facet; if (!k) return; const key = k === "flags" ? k : +k; e.target.open ? openFacets.add(key) : openFacets.delete(key); }, true);
dlg.addEventListener("close", () => { if (/^#m-/.test(location.hash)) location.hash = "measures"; });
addEventListener("hashchange", route);

function downloadCsv() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = "\ufeff" + [COLS.map(c => q(c.header)).join(","), ...current().map(x => x.r.map(q).join(","))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = "adaptation-measures.csv";
  document.body.append(a); a.click(); a.remove();
}

route();
