","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events","high","na","high","na","- People who work outdoors\n- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","na","Kanton Zürich (2018), K9; Kanton Freiburg (2021), S.5.2, adapted to municipalities"],["Gmd_ÖffHand_Lokalkl_HI-Leis_1","HI-Leis","Municipal level (municipalities)","Public authorities","Urban planning measures (local climate)","Structural measures","Consideration of local climate aspects in municipal outdoor design and site development","Where municipal outdoor design and site development take place in areas with a particular local climate or in the area of an important ventilation corridor, the local climate criterion is taken into account appropriately.","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","indirect impact","no","no","na","low","na","no","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","medium","Taking local climate aspects into account could reach its limits in the event of strong warming, if more and more areas were to become unsuitable.","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events, storm and hail events","medium","Once the outdoor design has been completed, it can no longer easily be dismantled","high","na","- People who work outdoors\n- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","na","Canton of Zurich (2018), K9; SwissTPH (2021), adapted to municipalities"],["Gmd_Bev_Lokalkl_HI-Leis_1","HI-Leis","Municipal level (municipalities)","entire population","Urban planning measures (local climate)","Structural measures","Urban planning measures to reduce heat build-up and heat islands","Promoting and ensuring ventilation; keeping cold-air and fresh-air corridors clear; increasing and upgrading the share of green space and reducing sealed surfaces; greening of buildings; creation of shaded public spaces such as parks, playgrounds, public transport stops, pavements (e.g. through tree-lined avenues); creation and extension of open, moving water surfaces; installation of permanently mounted drinking water dispensers in public spaces; the «sponge city» concept","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","direct, medium impact","yes","yes","na","medium","mechanical transplanting of a tree: price up to 1.5 m girth: approx. CHF 5,000.-\nAustria: approx. EUR 14,000 from concept to implementation\nConcept costs Uster, external development: CHF 60,000-100,000","medium","na","medium","Massnahmen gegen Hitze | Kanton Zürich (zh.ch)\nhttps://klar-anpassungsregionen.at/fileadmin/user_upload/regionen_24-46/33_suedlichesWeinviertel/Anpassungskonzept_KLAR_Suedliches_Weinviertel_Stand_Dezember_2021.pdf\nhttps://www.uster.ch/_docn/2957893/Bericht_Massnahmenplan-Klima-Uster_20210126.pdf","neutral impacts","na","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events, storm and hail events, increase in water scarcity","high","na","high","na","- People who work outdoors\n- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","see BAFU (2018) for specific measures and guidance","SwissTPH (2021), measure 20; Kanton Schaffhausen (2019), M17"],["Gmd_ÖffHand_SchBesch_HI-Leis_1","HI-Leis","Municipal level (municipalities)","Public authorities","Protection of employees against heat","Process-oriented measures","Prevention of «heat stress» for municipal employees","Review of the municipal directives/guidance on protecting cantonal employees working outdoors in accordance with ArGV 3 (Ordinance 3 to the Labour Act)","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","direct, low impact","yes","no","not relevant, as the target group is small","low","na","low","na","low","na","positive impacts","Increasing labour productivity raises value added","high","na","high","na","high","na","high","na","high","na","high","na","- People who work outdoors\n- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","na","based on Schweizerische Eidgenossenschaft (2020), AP2-gm4.1"],["Gmd_TeilBev_SchBesch_HI-Leis_1","HI-Leis","Municipal level (municipalities)","part of the population","Protection of employees against heat","Basic studies and strategies","Development of a heat plan for the federal offices and their employees","Heat action plans are suitable for communicating the health consequences of extreme heat efficiently within the administration, for achieving behavioural adjustments among employees and for coordinating prevention measures. A heat action plan sets out the need for action and specifies which measures are to be implemented.","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of impairment of human health","high","na","high","na","- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","Heat plans should take particular account of vulnerable groups","na","based on SwissTPH, chapter 4"],["Gmd_Bev_HochwSch_HW-Schäd_1","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Structural measures","Design protective structures to be robust and adaptable","Many older protective structures no longer meet the technical and ecological requirements in force today and must therefore be adapted to current requirements and to changed hazard situations, for example as a result of climate change.","planned adaptation","whole of Switzerland","local","Reduced physical damage","direct, high impact","yes","yes","na","high","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Gmd_Bev_HochwSch_HW-Schäd_2","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Operational measures","Implement operational protective measures in a robust and adaptable manner","Use accompanying measures (monitoring, early warning, keeping discharge corridors and deposition areas clear, evacuations and closures, etc.) in order to avoid an uncontrolled system collapse and to concentrate damage in areas with low damage potential. When planning operational protective measures, the possible consequences of events that exceed the design parameters of the protective structures are taken into account (extreme events, overload cases, risk-based objectives for measures).","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Gmd_Bev_HochwSch_HW-Schäd_3","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Structural measures","Manage protection forests robustly","Through the continuous rejuvenation of protection forests, climate-related changes in tree species composition are accommodated and the protective effect of the protection forests is guaranteed.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","yes","yes","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Gmd_Bev_ObjSchu_HW-Schäd_1","HW-Schäd","Municipal level (municipalities)","entire population","Property protection","Operational measures","Temporary property protection measures","Temporary property protection measures are erected as mobile or stationary barriers when there is a hazard from heavy precipitation, in order to secure critical infrastructure in a targeted manner. They depend on timely warning and efficient deployment planning and are designed purely to limit damage.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M8.1"],["Gmd_Bev_ObjSchu_SH-Schäd_1","SH-Schäd","Municipal level (municipalities)","entire population","Property protection","Operational measures","Temporary property protection measures","Temporary property protection measures are erected as mobile or stationary barriers when there is a hazard from storm and hail events, in order to secure critical infrastructure in a targeted manner. They depend on timely warning and efficient deployment planning and are designed purely to limit damage.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","based on BAFU/ARE (2022), measures M8.1"],["B_Bev_ObjSchu_HW-Schäd_2","HW-Schäd","Federal level (federal offices)","entire population","Property protection","Structural measures","Permanent property protection measures on federal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against flooding.","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","The measure enables synergies with the risk of loss of performance at work for federal employees","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","BAFU/ARE (2022), measures M8.2"],["Gmd_Bev_ObjSchu_HW-Schäd_2","HW-Schäd","Municipal level (municipalities)","entire population","Property protection","Structural measures","Permanent property protection measures on municipal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against flooding.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","The measure enables synergies with the risk of loss of performance at work for municipal employees","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","BAFU/ARE (2022), measures M8.2"],["B_Bev_ObjSchu_SH-Schäd_1","SH-Schäd","Federal level (federal offices)","entire population","Property protection","Structural measures","Permanent property protection measures on federal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against storm and hail.","planned adaptation","whole of Switzerland","national","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of property damage due to heavy precipitation and loss of performance at work","high","na","high","na","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","based on BAFU/ARE (2022), measures M8.2"],["Gmd_Bev_ObjSchu_SH-Schäd_2","SH-Schäd","Municipal level (municipalities)","entire population","Property protection","Structural measures","Permanent property protection measures on municipal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against storm and hail.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of property damage due to heavy precipitation and loss of performance at work","high","na","high","na","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","based on BAFU/ARE (2022), measures M8.2"],["Gmd_Bev_PrävNG_HW-Schäd_1","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Basic studies and strategies","Monitoring of local hazard processes","Permanent monitoring of hazard processes, weather and runoff forecasts. Joint task shared between the Confederation, cantons and municipalities.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n1"],["Gmd_Bev_RisikRP_HW-Schäd_1","HW-Schäd","Municipal level (municipalities)","entire population","Risk-based spatial planning","Requirements","Adaptation of municipal land-use and special land-use planning","Information on possible natural hazards and risks should be taken into account early in the spatial planning process, and the existing spatial planning instruments should be used in a targeted way for risk management: municipal land-use and special land-use planning, etc. The principles of risk-based land use should be enshrined in these instruments and the possibilities for implementing spatial planning measures to protect against natural hazards and climate-related changes should be strengthened. In extreme cases this may result in relocations.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","see Risikobasierte Raumplanung (ARE, 2019): https://www.are.admin.ch/are/de/home/medien-und-publikationen/publikationen/strategie-und-planung/risikobasierte-raumplanung.html","Schweizerische Eidgenossenschaft (2020), AP1-n4; Kanton Freiburg (2021), S.4.3"],["Gmd_Bev_RisikRP_HW-Schäd_2","HW-Schäd","Municipal level (municipalities)","entire population","Risk-based spatial planning","Structural measures","Measures relating to water retention within the settlement area","Carrying out a topographical analysis, in particular of flow paths and depressions (retention areas), in order to manage surface runoff. Additional retention spaces can be created by adjusting gradients or forming kerbs. Including topographically suitable potential areas, such as car parks, sports facilities or other areas that can be flooded without danger, can greatly expand the retention volume.","planned adaptation","whole of Switzerland","local","Reduced physical damage","direct, high impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M2.1"],["Gmd_Bev_WassRet_HW-Schäd_1","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Structural measures","Unsealing of surfaces","Preservation of green spaces and use of semi-permeable surfacing for squares, roads and paths. These include, for example, jointed paving, permeable paving, grass paver blocks or gravel lawns.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risk of impairment of human health","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M2.2"],["Gmd_Bev_WassRet_HW-Schäd_2","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Structural measures","Increase in retention areas in the settlement area","Thanks to their large surface area, ponds, lakes, open ditches and floodable green spaces can very easily provide large retention volumes even at low impounding depths. The retention volumes thus created serve as intermediate storage with throttled outflow. Vegetated swales and flood swales, which are usually dry and temporarily store water during heavy precipitation, are an effective option for decentralised infiltration and evaporation. Tree trenches provide support via impounding and infiltration areas. Floodable paved open spaces, roads or structures (underpasses, tunnels, etc.) can also be deliberately designed as temporarily floodable areas.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of impairment of human health and increasing drought: water scarcity","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M3.1, M4.1, M4.2, M4.3, M4.4, M7.1, M7.2, M7.3 and M7.4"],["Gmd_Bev_WassRet_HW-Schäd_3","HW-Schäd","Municipal level (municipalities)","entire population","Natural hazard prevention","Structural measures","Stream (revitalisation) with retention","Near-natural design or the daylighting of streams can slow down the flow velocity, create impounding areas and promote evaporation.","planned adaptation","whole of Switzerland","local","Reduced red. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","derived from SwissTPH (2021), measure 20; Kanton Schaffhausen (2019), M17"],["Kt_U_Lokalkl_HI-Ges_1","HI-Ges","Cantonal level (cantons)","Private sector","Urban planning measures (local climate)","Communication","Awareness-raising programme on climatic challenges for urban planners and construction industry professionals","A programme with various awareness-raising activities for actors in settlement design and construction is to be developed. The programme focuses in particular on events such as surface runoff and severe heat. The activities to limit the hazards and their consequences are therefore aimed at a varied target audience (municipal administrations, construction industry and urban planning professionals, etc.), who are to become familiar with the natural events and the associated risks as well as possible solutions. Within the framework of the EIA, the climate topic is offered at a continuing education day for firms specialising in EIA","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events, storm and hail events","high","na","high","na","none","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required th al: raising awareness among the population","Raising awareness of the health risks of heat among particularly vulnerable population groups, their carers and actors in the health and social system. Doctors (above all general practitioners and paediatricians are recommended) are made aware of their role in prevention. Through targeted information, those affected can cope better with heat. This reduces heat-related health complaints. Flyers and posters provide target-group-appropriate and practical guidance on important precautionary measures at home or in retirement homes and hospitals, list the symptoms of heat effects and provide instructions for action in crisis situations.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","Kanton Zürich (2018), G1.3; SwissTPH, measure 1; Kanton Freiburg (2021), S.1.2"],["Kt_Bev_SchBev_HI-Ges_8","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Process-oriented measures","Distribution of drinking water at publicly accessible places","Drinking is particularly important on hot days. Distribution of free drinking water in public places (e.g. on public transport, at railway stations, on motorways), at major events, or the provision of drinking fountains in public buildings.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","medium","Waste management is to be examined with regard to the distribution of PET bottles","high","na","high","na","high","na","high","na","none","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 17"],["Kt_Bev_SchBev_Hi-Ges_9","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Basic studies and strategies","Monitoring of morbidity and mortality","During the summer, morbidity and mortality patterns are monitored and analysed (e.g. number of emergency admissions stratified by age group and data on fever >38°C in the canton of VD, heat-related emergency hospital admissions in the canton of TI). This provides an overview of the current situation and enables efficient planning of measures. The data can be used when assessing the danger level of the heatwave and drawn on for further analyses (e.g. heat-related excess mortality). For the preparation and analysis of the data, advice from or the involvement of specialists (e.g. a research institute) is recommended.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH (2021), measure 18; Kanton Freiburg (2021), S.1.1"],["Kt_Bev_SchBev_HI-Ges_10","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Basic studies and strategies","Development of a cantonal heat plan","Heat action plans are suitable for communicating the health consequences of extreme heat efficiently within a canton, for achieving behavioural adjustments within the health sector and among the population, and for coordinating prevention measures. A heat action plan sets out the need for action and specifies which measures are to be implemented by which institutions.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, chapter 4"],["Kt_Bev_SchBev_HI-Ges_11","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Basic studies and strategies","Embedding of heat protection measures and heat action plans in climate change adaptation strategies","Measures to protect health from heat and heat action plans are embedded in climate adaptation strategies. This simplifies cooperation with other sectors (in particular urban planning, transport planning, construction) and supports coordination with actors involved in climate adaptation. Cross-sectoral cooperation is particularly important for long-term heat protection in urban regions and in buildings.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of loss of performance at work","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 19"],["Kt_Bev_SchBev_HI-Ges_2","HI-Ges","Cantonal level (cantons)","part of the population","Protection of the population against heat","Communication","Basic, further and continuing education of health care staff","Provision of basic, further and continuing education courses, online training courses and lectures for universities, health care institutions and other interested institutions.","planned adaptation","whole of Switzerland","national","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of loss of performance at work","high","na","high","na","none","medium","In basic, further and continuing education, the needs of vulnerable groups (e.g. the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors) are to be taken into account and awareness of their vulnerability specifically raised.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 3"],["Kt_Bev_SchBev_HI-Ges_3","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against h ation should be activated on the basis of MeteoSwiss's heat warning system.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","low","na","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 10"],["Kt_Bev_SchBev_HI-Ges_6","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Communication","Communication of the heat warning","Information for the population on the timing, duration and intensity of the forthcoming heatwave (according to information from MeteoSwiss). In addition, behavioural recommendations and further sources of information (FOPH website, MeteoSwiss, cantonal website, Alertswiss) are pointed out and the population is called upon to pay more attention to people at risk.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","Information should be easily accessible for all population groups (e.g. different languages, plain language, barrier-free, not only via digital channels). The population can be made aware of the needs of vulnerable groups (e.g. the older population (especially women), people in need of care, the chronically ill (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women and people who work outdoors).","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 11"],["Kt_Bev_SchBev_HI-Ges_7","HI-Ges","Cantonal level (cantons)","entire population","Protection of the population against heat","Communication"," ation against heat","Communication","Buddy system (carers look after people at risk)","People at risk are, if they agree to it, looked after by (voluntary) carers during a heatwave by means of visits and telephone calls. The buddy system requires cooperation between the canton and the municipalities.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","direct, medium impact","yes","yes","na","low","na","low","na","medium","na","neutral impacts","na","high","na","high","na","high","na","high","na","high","na","high","na","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","May have positive effects on social cohesion and solidarity.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 12"],["Kt_VulGr_SchBev_HI-Ges_3","HI-Ges","Cantonal level (cantons)","part of the population","Protection of the population against heat","Communication","Telephone helpline (heat hotline or other digital services)","To provide better support for (older) people during hot summer days, a telephone information service (heat hotline) is offered. Heat hotlines provide rapid information and help for people with symptoms. In addition, people around elderly people living at home, such as relatives and neighbours, can obtain information and advice. Where necessary, free home visits can also be offered. Heat hotlines can be operated throughout the summer or during heatwaves.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","direct, low impact","yes","no","na","low","na","low","na","low","na","neutral impacts","na","high","na","high","na","high","na","high","na","high","na","high","na","- Older people (especially women)","medium","The measure could be necessary for further vulnerable groups (e.g. the chronically ill and/or people with pre-existing health conditions (especially diabetes, cardiovascular diseases, elevated BMI/obesity), pregnant women) and should be easily accessible for all population groups (e.g. different languages, plain language, barrier-free).","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 13"],["Kt_ZivGes_SchBev_HI-Ges_1","HI-Ges","Cantonal level (cantons)","Civil society","Protection of the population against heat","Communication","Awareness-raising campaigns for sports clubs and youth associations","Sports and youth associations should be careful when training outdoors. This applies to all age groups, but especially to older people doing sport. Behavioural recommendations, information on the symptoms of heat effects and instructions for action in crisis situations are important.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","na","high","na","high","na","- Children, incl. infants in particular","medium","Here the associations should respond individually to the needs of their members and adapt measures where necessary so that \"everyone\" benefits.","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH, measure 7"],["Kt_Bev_KliGeb_HI-Kühl_1","HI-Kühl","Cantonal level (cantons)","entire population","Summer heat protection (buildings)","Requirements","Requirements for climate-adapted buildings (heat protection, greening, cooling, etc.)","Definition of requirements relating to building regulations and to the use of air conditioning systems in buildings.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high" y ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","high","These measures should be adapted to the needs of employees and communicated clearly and comprehensibly to all groups of employees (incl. the implications of the measures, e.g. under employment law). Employees paid by the hour should, for example, be protected against short-term measures with an impact on their wages","na","SwissTPH (2021), measure 15"],["Kt_TeilBev_SchBesch_HI-Leis_3","HI-Leis","Cantonal level (cantons)","part of the population","Protection of employees against heat","Communication","Guidance on office work in hot conditions","Hot days can affect health and performance. Office employees who work indoors on hot days are also affected. Employees are informed about precautionary measures by email, flyer or poster. Employers must also protect employees' health during hot days through technical, organisational and personal measures (see SECO factsheet).","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","low","na","positive impacts","Increasing labour productivity raises value added","high","na","high","na","high","na","high","Synergy with the risk of impairment of human health","high","na","high","na","- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","The information should take particular account of vulnerable groups and include specific guidance for them.","na","SwissTPH (2021), measure 16"],["Kt_TeilBev_SchBesch_HI-Leis_4","HI-Leis","Cantonal level (cantons)","part of the population","Protection of employees against heat","Basic studies and strategies","Development of a heat plan for the federal offices and their employees","Heat action plans are suitable for communicating the health consequences of extreme heat efficiently within the administration, for achieving behavioural adjustments among employees and for coordinating prevention measures. A heat action plan sets out the need for action and specifies which measures are to be implemented.","planned adaptation","whole of Switzerland","local","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of impairment of human health","high","na","high","na","- Pregnant women\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity","medium","Heat plans should take particular account of vulnerable groups","na","based on SwissTPH, chapter 4"],["Kt_Bev_SchBev_HI-Leis_1","HI-Leis","Cantonal level (cantons)","entire population","Protection of employees against heat","Basic studies and strategies","Heat early warning system","Accurate and timely weather warnings make it possible to issue up-to-date information on the timing, duration and intensity of the heatwave for the general population, the partner organisations of a cantonal heat action plan as well as for other specialists and authorities that contribute to protecting the population from heat. Measures to protect the population should be activated on the basis of MeteoSwiss's heat warning system.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","only an indirect impact and therefore only a small stimulus for the economy","high","na","high","na","high","na","high","Synergy with the risk of impairment of human health","high","na","high","na","none","low","","na","SwissTPH, measure 10"],["Kt_ZivGes_SchBesch_HI-Leis_1","HI-Leis","Cantonal level (cantons)","Civil society","Protection of employees against heat","Communication","Information for associations on measures in the event of heat","Associations whose members are involved in caring for risk groups are made aware of the health risks of heat and called upon to use their options for prevention, in particular by providing information and assistance to those affected on how to deal with heat.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","positive impacts","Increasing labour productivity raises value added","high","na","high","na","high","na","high","Synergy with the risk of impairment of human health","high","na","high","na","none","high","Here there should be broad education about various vulnerable groups in order to reduce inequalities.","na","Kanton Zürich (2018), G1.2"],["Kt_Bev_HochwSch_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Structural measures","Design protective structures to be robust and adaptable","Many older protective structures no longer meet the technical and ecological requirements in force today and must therefore be adapted to current requirements and to changed hazard situations, for example as a result of climate change.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","direct, high impact","yes","yes","na","high","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Kt_Bev_HochwSch_HW-Schäd_2","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Operational measures","Implement operational protective measures in a robust and adaptable manner","Use accompanying measures (monitoring, early warning, keeping discharge corridors and deposition areas clear, evacuations and closures, etc.) in order to avoid an uncontrolled system collapse and to concentrate damage in areas with low damage potential. When planning operational protective measures, the possible consequences of events that exceed the design parameters of the protective structures are taken into account (extreme events, overload cases, risk-based objectives for measures).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Kt_Bev_HochwSch_HW-Schäd_3","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Structural measures","Manage protection forests robustly","Through the continuous rejuvenation of protection forests, climate-related changes in tree species composition are accommodated and the protective effect of the protection forests is guaranteed.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","yes","yes","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n3"],["Kt_Bev_HochwSch_HW-Schäd_4","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Structural measures","Implementation of the hydraulic engineering concept","Development and implementation of the hydraulic engineering concept with corresponding flood protection measures within the canton.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","direct, high impact","yes","yes","na","high","Volume of all measures in the hydraulic engineering concept (BL): CHF 360 million, approx. CHF 2,000/m for flood protection measures and the daylighting of culverted watercourses","low","na","high","na","positive impacts","Support for construction activity","high","Protection against flooding is relevant for all emission scenarios.","high","Protection against flooding supports sustainability at all levels, as it protects lives and infrastructure and also prevents economic losses for companies or agriculture.","high","The costs are high, but they significantly reduce future damage. There is no alternative.","low","There are positive side effects with regard to reducing erosion, etc.","low","Hydraulic engineering projects are planned for the long term and can therefore no longer be adapted once they are in place.","high","na","none","low","na","na","Kanton Basel-Landschaft (2020), W2"],["Kt_Bev_ObjSchu_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","entire population","Risk-based spatial planning","Structural measures","Integrated rainwater management in the settlement area","Measures for dealing with heavy rain and for implementing water management according to the sponge city concept: preventive measures, topography and surface consolidation, measures on water surfaces and water bodies, measures in open spaces and street spaces, measures underground, measures on buildings, temporary measures, property protection measures","planned adaptation","whole of Switzerland","regional","Reduced physical damage","direct, high impact","no","yes","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","Increase in quality of life; support for water availability in dry periods (risk of increasing water scarcity)","high","na","high","na","none","low","na","na","BAFU/ARE (2022), Kanton Basel-Stadt (2021), M75"],["Kt_Bev_ObjSchu_HW-Schäd_2","HW-Schäd","Cantonal level (cantons)","entire population","Property protection","Structural measures","Permanent property protection measures on cantonal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against flooding.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risk of loss of performance at work for cantonal employees","high","na","high","na","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","BAFU/ARE (2022), measures M8.2"],["Kt_Bev_ObjSchu_SH-Schäd_1","SH-Schäd","Cantonal level (cantons)","entire population","Property protection","Structural measures","Permanent property protection measures on cantonal buildings","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against storm and hail events.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of property damage due to heavy precipitation and loss of performance at work","high","na","high","na","none","low","na","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","based on BAFU/ARE (2022), measures M8.2"],["Kt_Bev_PrävNG_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Basic studies and strategies","Monitoring of regional hazard processes","Permanent monitoring of hazard processes, weather and runoff forecasts. Joint task shared between the Confederation, cantons and municipalities.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n1"],["Kt_Bev_PrävNG_HW-Schäd_2","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Basic studies and strategies","Analysis of significant events and of the management of natural hazard risks","Preparation of event analyses in accordance with the requirements of the Confederation. When preparing event analyses, climate-relevant factors are also addressed in order to adapt measures to changed conditions. All events are recorded in the event database (StorMe).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n7"],["Kt_Bev_PrävNG_HW-Schäd_3","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Basic studies and strategies","Know the hazards and risks","National and cantonal hazard analyses are currently carried out at federal level as well as at cantonal level. These hazard analyses assess the hazard potential of specific hazard scenarios with regard to adaptation to climate change. They form the basis for precautionary planning. The analysis makes it possible to identify deficits and to derive and coordinate prevention and precautionary measures. Activities: a) Consistent and regular updating of the hazard data (in order to capture changes in good time), extension to areas outside settlement areas. b) Provision of hazard data that has been missing or needs to be completed (e.g. for tsunamis or a hazard map for surface runoff). c) Consistent provision of the existing hazard data. d) Comprehensive and systematic risk assessment. Identification of critical infrastructure (e.g. electricity supply, supply and disposal, etc.) and special facilities (e.g. schools, hospitals) of national importance in the hazard area.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n2; Kanton Freiburg (2021), S.5.4"],["Kt_Bev_PrävNG_HW-Schäd_4","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Basic studies and strategies","Integration of climate change into emergency concepts and planning","Consideration of the effects of climate change in emergency concepts and planning in good time by those responsible at cantonal level.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n5"],["Kt_Bev_PrävNG_HW-Schäd_5","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Communication","Implementation of information and awareness-raising activities on natural hazards","Information and awareness-raising activities regarding the risks and effects of climate change on natural hazards are carried out for all actors concerned (politicians, municipalities, insurers, owners, the population, etc.).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Kanton Zürich (2018), N1; Kanton Freiburg (2021), S1.6"],["Kt_Bev_PrävSH_SH-Schäd_1","SH-Schäd","Cantonal level (cantons)","entire population","Prevention of storm and hail events","Communication","Implementation of information and awareness-raising activities on storm and hail events","Information and awareness-raising activities regarding the risks and effects of climate change on storm and hail events are carried out for all actors concerned (politicians, municipalities, insurers, owners, the population, etc.).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risk of property damage due to heavy precipitation","high","na","high","na","none","low","na","na","based on Kanton Zürich (2018), N1; Kanton Freiburg (2021), S1.6"],["Kt_Bev_RisikRP_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","entire population","Risk-based spatial planning","Requirements","Adaptation of the cantonal spatial planning instruments","Information on possible natural hazards and risks should be taken into account early in the spatial planning process, and the existing spatial planning instruments should be used in a targeted way for risk management: structure planning, general drainage plan (GEP), zoning planning, etc. The principles of risk-based land use should be enshrined in these instruments and the possibilities for implementing spatial planning measures to protect against natural hazards and climate-related changes should be strengthened. In extreme cases this may result in relocations.","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","see Risikobasierte Raumplanung (ARE, 2019): https://www.are.admin.ch/are/de/home/medien-und-publikationen/publikationen/strategie-und-planung/risikobasierte-raumplanung.html","Schweizerische Eidgenossenschaft (2020), AP1-n4; Kanton Freiburg (2021), S.4.3"],["Kt_Bev_RisikRP_HW-Schäd_2","HW-Schäd","Cantonal level (cantons)","Private sector","Risk-based spatial planning","Communication","Strengthen natural hazard awareness, continuing education and research in the field of natural hazards","Enabling clients, architects, planners, intervention forces and the population to deal with natural hazard risks. Ongoing training of local natural hazard advisers and of the emergency services concerned on site. The results of targeted research and development on the changes brought about by climate change feed continuously into continuing education and awareness-raising measures (e.g. NCCS, CH2018).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Schweizerische Eidgenossenschaft (2020), AP1-n6"],["Kt_Bev_RisikRP_HW-Schäd_3","HW-Schäd","Cantonal level (cantons)","entire population","Risk-based spatial planning","Structural measures","Measures relating to water retention outside the settlement area","Planning analysis of the entire catchment area to identify measures for water retention (retention areas, dams, ditch systems, adapted use and management of agricultural and forestry land, tree planting, etc.).","planned adaptation","whole of Switzerland","regional","Reduced physical damage","direct, high impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M1.1 and M1.2; Kanton Basel-Stadt (2021), M75"],["Kt_U_RisikRP_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","Private sector","Risk-based spatial planning","Communication","Awareness-raising programme on climatic challenges for urban planners and construction industry professionals","A programme with various awareness-raising activities for actors in settlement design and construction is to be developed. The programme focuses in particular on events such as surface runoff and severe heat. The activities to limit the hazards and their consequences are therefore aimed at a varied target audience (municipal administrations, construction industry and urban planning professionals, etc.), who are to become familiar with the natural events and the associated risks as well as possible solutions. Within the framework of the EIA, the climate topic is offered at a continuing education day for firms specialising in EIA","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","na","high","na","high","na","none","low","na","na","Kanton Freiburg (2021), S.1.4"],["Kt_Bev_WassRet_HW-Schäd_1","HW-Schäd","Cantonal level (cantons)","entire population","Natural hazard prevention","Structural measures","Stream (revitalisation) with retention","Near-natural design or the daylighting of streams can slow down the flow velocity, create impounding areas and promote evaporation.","planned adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","low","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of impairment of human health and increasing drought: water scarcity","high","na","high","na","none","low","na","na","BAFU/ARE (2022), measures M3.2"],["Kt_U_TourAng_SFG-Ertrag_1","SFG-Ertrag","Cantonal level (cantons)","Private sector","Adapting the tourism offering","Requirements","Concentration of snow sports facilities in suitable locations","When authorising facilities, ensure that they are located in suitable locations","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","none","na","low","na","indirect","na","neutral impacts","Due to the indirect steering effect, no macroeconomic effects are expected","medium","The measure is effective only if emissions continue to rise sharply. Under the RCP2.6 scenario the measure would not be effective, or would not be necessary","medium","New snow sports facilities in higher-lying areas have an influence on ecology and the environment. This must be taken into account when developing them and in the authorisation procedure (environmental impact assessment).","high","The financial implications of this measure are very small, as it \"only\" concerns authorisation.","low","Higher-lying areas can expand their offering, whereas others cannot. The ecological effects must be taken into account here (see sustainability).","high","Authorisation procedures are very flexible and can be adapted readily.","medium","New facilities could lead to increased energy consumption and thus counteract climate change mitigation. This is to be examined during authorisation. With regard to climate adaptation, it must also be examined what influence any facilities have on aspects of climate adaptation such as biodiversity or the landscape.","none","low","na","na","Cantonal climate strategies"],["Kt_U_TourAng_SFG-Ertrag_2","SFG-Ertrag","Cantonal level (cantons)","Private sector","Adapting the tourism offering","Funding and promotion","Promotion of the development of a climate-adapted tourism offering (diversification, snow-free offerings, etc.)","Use cantonal funding instruments to adapt the tourism offering for winter ski resorts towards year-round tourism, alternative offerings in winter, etc.","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","none","na","indirect","na","positive impacts","Stimulus through financial support for tourism businesses","high","na","high","An adapted tourism offering supports sustainability, provided this is taken into account in the funding applications (assumption).","high","na","high","The reorientation of the offering supports Swiss tourism and makes it more marketable for the region.","high","Funding is awarded to those who contribute innovative and good ideas, and the funds can be deployed flexibly.","medium","When adapting the tourism offering, potential conflicts of objectives with climate change mitigation or with topics such as biodiversity, the landscape and the water supply are possible. Careful planning and a weighing of interests are essential.","none","low","na","na","EBP"],["Kt_Bev_SchuInf_SO-Ges_1","SO-Ges","Cantonal level (cantons)","entire population","Protection against infectious diseases","Operational measures","Implementation of the tiger mosquito control strategy","Control is carried out by removing/emptying places with standing water in order to prevent breeding sites. Water sites that cannot os, but its intensity may vary depending on the scenario.","high","The measure supports the weighing up of the various levels.","high","There are no alternatives and the measure can be implemented with reasonable effort.","medium","Synergy with revenue losses in agriculture and hydropower production during dry periods","low","The concessions are awarded for a specific period and are therefore not flexible.","medium","The various actors have clear needs that may not be fully met in all situations. This circumstance must be taken into account accordingly.","none","low","na","na","Kanton Zürich (2018), W2 (part 2); Kanton Schaffhausen (2019), M2; Kanton Luzern (2021), KA-WW3"],["Kt_Bev_ReduWass_TR-Wass_1","TR-Wass","Cantonal level (cantons)","entire population","Reduction of water consumption","Requirements","Restrictions on water consumption during dry periods","Definition of a cantonal emergency plan for restrictions on the water consumption of the various actors at cantonal level (in cooperation with the municipalities)","planned adaptation","whole of Switzerland","regional","Increased adaptive capacity","indirect impact","no","no","na","low","na","low","na","indirect","na","negative impacts","depending on the extent of the drought, certain sectors may be severely affected","high","The measure clarifies how drinking water is to be handled during drought and is relevant for all emission scenarios.","high","Sustainability is assured and supports both the ecological level (securing the water balance in nature, in lakes and rivers) and the economic level (hydropower, irrigation for agriculture, etc.) and the social level (use of lakes and rivers, etc.).","high","The measures can be implemented at low cost and there are few alternatives","medium","Reducing water consumption saves costs and protects the environment (incl. biodiversity, climate change mitigation). In addition, there are synergies with revenue losses in agriculture and with hydropower production during dry Private individuals","entire population","Summer heat protection (buildings)","Structural measures","Creating an optimal indoor climate in residential buildings","Structural, technical and operational measures are intended to prevent the overheating of buildings and thus create an optimal indoor climate: heat-adequate building design for new builds; installation of systems to release the heat trapped inside buildings during the night (night-time cooling by means of, e.g., automatically opening windows or an extract air system with negative-pressure openings in the parapet area); improvement of building insulation (including of uninsulated loft spaces); solar protection of buildings and window surfaces; greening of buildings; increasing the proportion of reflected radiation through a suitable choice of building colours and building materials; use of best-in-class appliances (computers, televisions, refrigerators, lighting, etc.) that are energy-efficient and emit little heat; switching to LED lamps; retrofitting of ventilation systems (which, among other things, bring better and cooler air into the building with the windows closed and avoid ineffective individual cooling units).","autonomous adaptation","whole of Switzerland","local","Increased adaptive capacity","direct, medium impact","yes","yes","na","high","Switchable film/glass or electrochromic glass: 600-990 CHF/m^2; extensive green roof approx. 32-50 CHF/m^2; ground-based façade greening: approx. 250-600 CHF/m^2; wall-bound façade greening approx. 700 to 20000 CHF/m^2; waste heat to be dissipated approx. 300-1,500 CHF per kilowatt","low","extensive green roof: 1.40 CHF per m^2 and year","medium","Switchable glass etc.: Fensterversand (2024)\nGreening: https://www.zh.ch/de/umwelt-tiere/klima/hitze-im-siedlungsraum/massnahmen-gegen-hitze.html#-1259012360","positive impacts","na","high","na","high","na","high","na","high","Synergies with the risks of impairment of human health, increase in cooling energy demand, heavy rainfall events","high","na","medium","Summer heat protection can be damaged by storm and hail events.","- Older people/the older population, incl. older women in particular\n- Pregnant women, incl. their unborn children\n- Children, incl. infants in particular\n- People with pre-existing health conditions and chronically ill people, in particular people with diabetes, cardiovascular diseases, pollen allergies as well as immunodeficient people, people with an elevated BMI/obesity\n- People with low socio-economic status","medium","People with low socio-economic status are hit harder by increased energy costs and construction measures; the implementation of the requirements must be financially supported for social housing","See detailed proposals for measures in the tab \"Measures_ClimateAdaptedBldgs\"\n\nThe existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","SwissTPH (2021), measure 21"],["P_Bev_Kli-Geb_Hi-Ges_1","HI-Ges","Private individuals","entire population","Installation of cooling systems (buildings)","Technical measure","Installation of cooling systems in buildings","To reduce the temperature in indoor spaces, these can be cooled accordingly (e.g. groundwater heat pumps in a free-cooling process).","autonomous adaptation","whole of Switzerland","national","Increased adaptive capacity","direct, high impact","yes","yes","na","medium","100-3'000 pro Anlage","low","100-350","medium","https://www.energieheld.ch/heizung/raumluft/klimaanlage\nKlimaanlage in der Schweiz - Arten, Kosten und Förderung (energieheld.ch)","positive impacts","Strengthening of construction activity","medium","The measure makes sense and is important only under the higher emission scenarios.","medium","At the environmental level, the installation of cooling systems leads to higher resource consumption and energy consumption.","low","Summer heat protection is an alternative that can be used. However, this is not always technically possible.","medium","Synergies with the risks of impairment of human health and increase in cooling energy demand","low","Installed cooling systems cannot easily be rebuilt or modified.","low","There are conflicts of objectives with climate change mitigation due to the increased energy consumption in summer for cooling. The energy supply for the cooling systems should be covered by renewable energies.","none","medium","People with low socio-economic status are hit harder by increased energy costs and construction measures; the implementation of the requirements must be financially supported for social housing","The existing specialist literature shows that climate adaptation measures tend to be reactive and sector-specific. They often aim at modifying existing infrastructure, disseminating information and integrating climate issues into planning guidelines. While they provide a valuable basis, they are not sufficient to meet the high adaptation requirements for reducing heat-related mortality and morbidity. To achieve effective adaptation, transformative changes are required that are spatially integrated, socially inclusive and institutionally anchored. This includes, among other things, explicitly taking account of the needs of vulnerable population groups.","EBP"],["P_Bev_ObjSchu_HW-Schäd_1","HW-Schäd","Private individuals","entire population","Property protection","Structural measures","Permanent property protection measures","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against flooding.","autonomous adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of impairment of human health, loss of performance at work","high","na","high","na","- People with low socio-economic status","medium","People with low socio-economic status can be severely affected by natural hazards but, because of their financial constraints, are unable to take measures on their own responsibility. The implementation of these incentives should be financially supported on a case-by-case basis.","see a selection of detailed measures in the tab \"Measures_ClimateAdaptedBldgs\"","BAFU/ARE (2022), measures M8.2"],["P_Bev_ObjSchu_SH-Schäd_1","SH-Schäd","Private individuals","entire population","Property protection","Structural measures","Permanent property protection measures","Buildings and infrastructure at risk can be secured in a targeted manner with conceptual or technical measures integrated into their use, and thus permanently protected against storm and hail events.","autonomous adaptation","whole of Switzerland","local","Reduced physical damage","indirect impact","no","no","na","medium","na","low","na","indirect","na","neutral impacts","Indirect impact with no influence on the economy","high","na","high","na","high","na","high","The measure enables synergies with the risks of property damage due to heavy precipitation, impairment of human health, loss of performance at work","high","na","high","na","- People with low socio-economic status","medium","People with low socio-economic status can be severely affected by natural hazards but, because of
